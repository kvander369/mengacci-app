<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1E5A3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mengacci">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Mengacci $$</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  /* Mengacci $$ V1. The screens are the ones settled on the mock (docs/DESIGN.md);
     the rules are app/scoring.js (docs/RULES.md). Kyle reads with bifocals: big
     type, one scale, no instructions on screen. */
  :root{
    --bg:#E9EFE8; --panel:#FBFCFA; --ink:#16241C; --muted:#5C6B61; --line:#CBD6CD;
    --green:#1E5A3C; --green-ink:#F4F8F4; --green-soft:#DCEADF;
    --gold:#A8781F; --gold-soft:#F5EBD3;
    --dead:#8F3F30; --dead-soft:#F4E1DC;
    --key:#FFFFFF; --key-ink:#16241C; --key-down:#D7E4D9; --key-edge:#C4D2C7;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.35;
    -webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none}
  button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  /* the phone column: fixed height, the middle scrolls, the pad stays put */
  .phone{display:flex;flex-direction:column;background:var(--panel);height:100vh;height:100dvh;overflow:hidden;max-width:430px;margin:0 auto}
  @media (min-width:600px){
    body{padding:20px 0}
    .phone{height:min(880px,calc(100dvh - 40px));min-height:0;border-radius:38px;border:9px solid #1B1F1C;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.28)}
  }

  .top{background:var(--green);color:var(--green-ink);padding:calc(14px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex:none}
  .tophead{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{width:46px;height:46px;flex:none;object-fit:contain;background:var(--green-ink);border-radius:50%;padding:3px}
  .eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:12px;opacity:.85}
  .top h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;margin:2px 0 0;line-height:1}
  .top .right{font-family:"Barlow Condensed",sans-serif;font-size:15px;font-weight:600;text-align:right;opacity:.9;white-space:nowrap}
  .tabs{display:flex;flex:none;border-bottom:1px solid var(--line);background:var(--panel)}
  .tab{flex:1;border:0;background:transparent;padding:10px 4px 8px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:19px;color:var(--muted);border-bottom:3px solid transparent}
  .tab.on{color:var(--green);border-bottom-color:var(--green)}

  .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .stack{display:flex;flex-direction:column;gap:10px}

  .lbl{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--muted)}
  .big{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .note{font-size:15px;color:var(--muted)}
  .sect{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;line-height:1.1;color:var(--ink);padding-top:6px}

  .btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 16px;background:var(--green);color:var(--green-ink);
    font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;letter-spacing:.03em;text-align:center}
  .btn.quiet{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:600}
  .btn.gold{background:var(--gold);color:#1B1408}
  .btn.danger{background:var(--dead-soft);color:var(--dead);border:0}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.sm{padding:9px 12px;font-size:16px;border-radius:9px}
  .btn.link{background:transparent;color:var(--muted);border:0;padding:6px;font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
  .row{display:flex;gap:10px}
  .row>.btn{flex:1}
  .row.links{justify-content:space-between}
  .row.links>.btn{flex:0 1 auto}
  .xbtn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--dead);font-size:24px;line-height:1;font-weight:600;flex:none}

  .list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
  .item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
  .item .name{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:21px;flex:1;line-height:1.1}
  .item.out .name{color:var(--muted);text-decoration:line-through}
  .pill{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .pill.ok{background:var(--green-soft);color:var(--green)}
  .pill.pend{background:var(--gold-soft);color:var(--gold)}
  .pill.team{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .parked{display:flex;align-items:center;gap:12px;background:var(--gold-soft);border-radius:12px;padding:10px 14px}
  .parked .name{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:21px;line-height:1.1}
  .parked .sub{font-size:14px;color:var(--muted)}

  .pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 2px}
  .pick .box{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:700;color:var(--green-ink)}
  .pick.on .box{background:var(--green);border-color:var(--green)}
  .pick .name{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:22px;flex:1;line-height:1.1}
  .pick.done{opacity:.45}

  /* fields */
  .fld{display:flex;flex-direction:column;gap:4px;flex:1}
  .inp{font:inherit;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:22px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);width:100%}
  .inp:disabled{opacity:.55;background:var(--bg)}
  .check{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
  .check.good{background:var(--green-soft);color:var(--green)}
  .check.bad{background:var(--dead-soft);color:var(--dead)}
  .check.warn{background:var(--gold-soft);color:var(--gold)}
  .check .t{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;line-height:1.1}

  /* entry */
  .who{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .who .name{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:32px;line-height:1}
  .who .step{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:17px;color:var(--muted);letter-spacing:.04em;text-align:right}
  .pass2 .top{background:var(--gold);color:#1B1408}
  .strip{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
  .cell{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px}
  .cell .hn{font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:700;color:var(--ink);line-height:1}
  .cell .sc{width:100%;aspect-ratio:1/1.2;border:1.5px solid var(--line);border-radius:8px;display:grid;place-items:center;
    font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:27px;font-variant-numeric:tabular-nums;background:var(--panel)}
  .cell .par{font-family:"Barlow Condensed",sans-serif;font-size:14px;color:var(--muted)}
  .cell.cur .sc{border-color:var(--green);border-width:2.5px}
  .cell.armed .sc{border-color:var(--gold);border-width:2.5px;background:var(--gold-soft)}
  .cell.under .sc{background:var(--green-soft);color:var(--green)}
  .cell.none .sc{color:var(--muted);background:var(--bg)}
  .cell .dot{display:flex;gap:3px;height:12px;align-items:center}
  .cell .dot i{display:block;width:11px;height:11px;border-radius:50%;background:var(--gold)}
  .now{display:flex;align-items:baseline;gap:12px;padding:4px 0}
  .now .big{font-size:32px}
  .now .rest{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;color:var(--muted)}
  .fix{display:flex;align-items:center;gap:14px;background:var(--gold-soft);border-radius:12px;padding:8px 14px}
  .fix .huge{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:44px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
  .fix .rest{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:18px;color:var(--muted)}
  .ask{display:grid;grid-template-columns:auto auto 1fr auto auto;align-items:center;gap:10px;background:var(--green-soft);border-radius:12px;padding:8px 12px}
  .ask .huge{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:44px;line-height:1;color:var(--green);font-variant-numeric:tabular-nums}
  .ask .rest{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;color:var(--muted)}
  .ask .btn{width:auto;padding:10px 18px;font-size:22px}
  .ask .btn.no{background:var(--dead-soft);color:var(--dead)}
  .sumline{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0 0}
  .sumline .big{font-size:28px}
  .digits{display:flex;align-items:center;gap:10px}
  .digits .box{min-width:92px;height:64px;border:2px solid var(--green);border-radius:12px;display:grid;place-items:center;
    font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:38px;font-variant-numeric:tabular-nums}
  .digits .box.empty{border-color:var(--line);color:var(--muted)}
  .padwrap{flex:none;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .key{height:48px;border-radius:12px;border:1px solid var(--key-edge);background:var(--key);color:var(--key-ink);
    font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;box-shadow:0 1px 0 var(--key-edge)}
  .key:active{background:var(--key-down)}
  .key.util{font-size:17px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:transparent;box-shadow:none}
  .key.go{background:var(--green);color:var(--green-ink);border-color:var(--green)}
  .key.none{font-size:20px;color:var(--muted)}
  .photo{width:100%;border-radius:12px;border:1px solid var(--line);display:block;max-height:220px;object-fit:cover}
  input[type=file]{display:none}
  .drow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .drow .l{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:19px;line-height:1.1}
  .drow .l small{display:block;font-family:"Barlow",sans-serif;font-weight:400;font-size:13px;color:var(--muted)}
  .choice{min-width:58px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--key);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:24px}
  .choice.on{background:var(--green);color:var(--green-ink);border-color:var(--green)}

  /* tables and the board */
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:16px;color:var(--muted);text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
  th.r{text-align:right}
  td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
  td.n{text-align:right;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:18px}
  td.hn{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;width:34px}
  td.team{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px}
  td.topar{font-size:26px;color:var(--green)}
  td.who{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:18px;padding-left:22px}
  tr.skin td{background:var(--green-soft)}
  tr.skin td.who{color:var(--green);font-weight:600}
  tr.skin td.hn{width:44px}
  tr.skin td.n{font-size:18px}
  table.tight td{padding:3px 4px}
  table.tight td.team{font-size:18px}
  table.tight td.topar{font-size:21px}
  table.tight td.hn{font-size:15px;width:26px;color:var(--muted)}
  table.tight td.n{font-size:15px}
  .break{height:22px;margin:8px -16px 0;border-top:6px solid var(--green);border-bottom:1px solid var(--line);background:var(--bg)}
  .secthead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .secthead .pill{text-transform:none;letter-spacing:0;font-size:14px}
  .tie{padding:10px 0;border-bottom:1px solid var(--line)}
  .tie .t{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px}
  .tie .sub{font-size:15px;color:var(--muted)}
  .stamp{font-size:13px;color:var(--muted);text-align:center;padding-top:16px}

  /* TV: the board on a wide screen. No frame, two columns, bigger type, nothing to scroll. */
  @media (min-width:900px){
    .phone.tv{max-width:none;width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}
    .phone.tv .top{padding:18px 40px 14px}
    .phone.tv .eyebrow{font-size:20px}
    .phone.tv .top h1{font-size:40px}
    .phone.tv .logo{width:84px;height:84px;padding:5px}
    .phone.tv .tophead{gap:22px}
    .phone.tv .scroll{padding:18px 40px 24px;overflow:hidden}
    .phone.tv .tvgrid{display:grid;grid-template-columns:3fr 2fr;gap:0 48px;align-items:start}
    .phone.tv .col{display:flex;flex-direction:column;gap:12px;min-width:0}
    .phone.tv .col+.col{border-left:6px solid var(--green);padding-left:40px}
    .phone.tv .sect{font-size:32px}
    .phone.tv th{font-size:20px}
    .phone.tv table.tight td{padding:4px 6px}
    .phone.tv table.tight td.team{font-size:26px}
    .phone.tv table.tight td.topar{font-size:30px}
    .phone.tv table.tight td.hn{font-size:20px;width:40px}
    .phone.tv table.tight td.n{font-size:20px}
    .phone.tv td.who{font-size:26px;padding-left:28px}
    .phone.tv tr.skin td.hn{font-size:24px;width:60px}
    .phone.tv tr.skin td.n{font-size:26px}
    .phone.tv .pill{font-size:18px}
    .phone.tv .secthead .pill{font-size:18px}
  }
  @media (prefers-reduced-motion:no-preference){ .key:active{transform:scale(.97)} }
  .trial{background:#8a1c1c;color:#fff;font-weight:700;letter-spacing:.06em;text-align:center;padding:6px 8px;font-size:13px}
</style>
</head>
<body>
<div class="phone" id="app"></div>
<script src="scoring.js"></script>
<script>
(function(){
  "use strict";
  var Sc = window.Scoring, PAR = Sc.PAR;
  var NONE = -1;   /* a hole with no score, in a draft: entered, but not a number. RULES.md "A player who cannot finish" */

  /* ---------- state: one object, saved on every change ---------- */
  var LS = "mengacci_try_v1";   /* TRY build: its own key. The real app uses mengacci_v1; the two must never meet. */
  var S = load();
  function fresh(){
    return { view:"setup", people:[], teams:[], withdrawn:[], setup:{name:"Mengacci $$",date:"",net:"",gross:""}, cutoff:null, locked:false,
             cards:[], parked:[], draft:null, nextId:1, nextTeam:1, nextPerson:1 };
  }
  function load(){
    try{ var raw=localStorage.getItem(LS); if(raw){ var s=JSON.parse(raw); if(s && s.cards) return s; } }catch(e){}
    return fresh();
  }
  function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }

  /* ---------- photos: kept in IndexedDB, keyed by card id ---------- */
  var db=null;
  function openDB(){
    return new Promise(function(res){
      if(db) return res(db);
      if(!window.indexedDB) return res(null);
      var r=indexedDB.open("mengacci_try",1);
      r.onupgradeneeded=function(){ r.result.createObjectStore("photos"); };
      r.onsuccess=function(){ db=r.result; res(db); };
      r.onerror=function(){ res(null); };
    });
  }
  function putPhoto(id, blob){ return openDB().then(function(d){ if(!d) return; return new Promise(function(res){ var t=d.transaction("photos","readwrite"); t.objectStore("photos").put(blob, String(id)); t.oncomplete=res; t.onerror=res; }); }); }
  function getPhoto(id){ return openDB().then(function(d){ if(!d) return null; return new Promise(function(res){ var r=d.transaction("photos").objectStore("photos").get(String(id)); r.onsuccess=function(){ res(r.result||null); }; r.onerror=function(){ res(null); }; }); }); }
  function allPhotos(){ return openDB().then(function(d){ if(!d) return []; return new Promise(function(res){ var out=[], r=d.transaction("photos").objectStore("photos").openCursor(); r.onsuccess=function(){ var c=r.result; if(c){ out.push({id:c.key, blob:c.value}); c.continue(); } else res(out); }; r.onerror=function(){ res(out); }; }); }); }

  /* ---------- people, teams, the day's roster ---------- */
  function fullName(p){ return (p.first+" "+p.last).trim(); }
  function person(id){ for(var i=0;i<S.people.length;i++) if(S.people[i].id===id) return S.people[i]; return null; }
  function personName(id){ var p=person(id); return p?fullName(p):"?"; }
  function teamOf(id){ for(var i=0;i<S.teams.length;i++) if(S.teams[i].players.indexOf(id)>=0) return S.teams[i]; return null; }
  function isWithdrawn(t){ return S.withdrawn.indexOf(t.id)>=0; }
  /* ROSTER: everyone on a team today, with team index and whether the team is out */
  var ROSTER=[];
  function rebuildRoster(){ ROSTER=[]; S.teams.forEach(function(t,i){ var out=isWithdrawn(t); t.players.forEach(function(id){ var p=person(id); if(p) ROSTER.push({id:id,name:fullName(p),first:p.first,last:p.last,team:i+1,out:out}); }); }); }
  function player(id){ for(var i=0;i<ROSTER.length;i++) if(ROSTER[i].id===id) return ROSTER[i]; return null; }
  /* first name for the board; a last initial only when two players in the field share the first name */
  function first(id){ var p=player(id); if(!p) return "?"; var clash=ROSTER.some(function(q){ return q.id!==p.id && q.first===p.first; }); return p.first+(clash&&p.last?" "+p.last.charAt(0)+".":""); }
  function onACard(id){ return S.cards.some(function(c){ return c.players.indexOf(id)>=0; }) || S.parked.some(function(d){ return d.players.indexOf(id)>=0; }); }

  function sum(a, from, to){ var t=0; for(var i=from;i<to;i++) if(a[i]!=null && a[i]!==NONE) t+=a[i]; return t; }
  function filled(a, from, to){ var n=0; for(var i=from;i<to;i++) if(a[i]!=null) n++; return n; }
  function hasNone(a, from, to){ for(var i=from;i<to;i++) if(a[i]===NONE) return true; return false; }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function now(){ var d=new Date(), h=d.getHours()%12||12, m=d.getMinutes(); return h+":"+(m<10?"0":"")+m; }
  function stampDate(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function toNull(a){ return a.map(function(v){ return v===NONE?null:v; }); }

  /* ---------- DOM helpers ---------- */
  function h(tag, attrs, kids){
    var el=document.createElement(tag);
    if(attrs) for(var k in attrs){
      if(k==="class") el.className=attrs[k];
      else if(k==="text") el.textContent=attrs[k];
      else if(k==="html") el.innerHTML=attrs[k];
      else if(k.indexOf("on")===0) el[k]=attrs[k];
      else if(k==="disabled"){ if(attrs[k]) el.disabled=true; }
      else if(k==="value") el.value=attrs[k];
      else el.setAttribute(k, attrs[k]);
    }
    (kids||[]).forEach(function(c){ if(c==null) return; el.appendChild(typeof c==="string"?document.createTextNode(c):c); });
    return el;
  }
  var app=document.getElementById("app"), lastKey=null;
  function isTV(){ return S.view==="board" && (window.innerWidth||0)>=900; }
  function paint(topEl, bodyKids, padEl, cls){
    var key=S.view+"|"+(S.draft?S.draft.step+"|"+S.draft.pass+"|"+S.draft.pi+"|"+S.draft.nine:"");

  /* ---------- HOLES ---------- */
  function strip(pid, a, nine){
    var d=S.draft, o=nine*9, st=h("div",{class:"strip"});
    var hc=(d.pass===1?d.hcp1:d.hcp2)[pid]||0;
    var next=-1; for(var i=o;i<o+9;i++) if(a[i]==null){ next=i; break; }
    for(var i=o;i<o+9;i++){
      (function(i){
        var v=a[i], cls="cell";
        if(d.armed===i) cls+=" armed"; else if(d.armed==null && i===next) cls+=" cur";
        if(v===NONE) cls+=" none"; else if(v!=null && v<PAR[i]) cls+=" under";
        var dd=Sc.dots(hc,i);

      } else {

  /* ---------- DIFF ---------- */
  function diffs(){
    var d=S.draft, out=[];
    d.players.forEach(function(pid){
      if(d.hcp1[pid]!==d.hcp2[pid]) out.push({key:pid+":h",pid:pid,label:"Handicap",a:d.hcp1[pid],b:d.hcp2[pid]});
      for(var i=0;i<18;i++) if(d.s1[pid][i]!==d.s2[pid][i]) out.push({key:pid+":"+i,pid:pid,label:"Hole "+(i+1)+" · par "+PAR[i],a:d.s1[pid][i],b:d.s2[pid][i],i:i});
    });
    return out;
  }
  function show(v){ return v===NONE?"none":String(v); }

    var d=S.draft, list=diffs(), kids=[];

      kids.push(h("div",{class:"check good"},[ h("div",{class:"t",text:"Both passes agree, every hole, every handicap."}) ]));
      kids.push(h("button",{class:"btn",text:"Continue",onclick:function(){ d.step="confirm"; render(); }}));
    }else{
      kids.push(h("div",{class:"big",text:list.length+" difference"+(list.length>1?"s":"")}));
      kids.push(h("div",{class:"note",text:"Look at the paper. First pass on the left, second on the right."}));
      var box=h("div");
      list.forEach(function(x){
        var pick=d.res[x.key];
        box.appendChild(h("div",{class:"drow"},[
          h("div",{class:"l"},[first(x.pid)+" ", h("small",{text:x.label})]),
          h("button",{class:"choice"+(pick==="a"?" on":""),text:show(x.a),onclick:function(){d.res[x.key]="a";render();}}),

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E5A3C">
<title>Vander-Total-Points Pot</title>
<link rel="icon" href="ccw-logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  /* Two screens in one file: the BOARD (the club TV, and any phone that opens
     this address) and ENTRY (?enter=1, Kyle's phone). The arithmetic is in
     points.js, which both load. Read from across a room: one type scale, no
     instructions on the board, nothing that scrolls on a TV. */
  :root{
    --bg:#E9EFE8; --panel:#FBFCFA; --ink:#16241C; --muted:#5C6B61; --line:#CBD6CD;
    --green:#1E5A3C; --green-ink:#F4F8F4; --green-soft:#DCEADF;
    --gold:#A8781F; --gold-soft:#F5EBD3;
    --k:1;                     /* the board shrinks to the screen: see fit() */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--panel);color:var(--ink);
    font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.35;
    overflow:hidden}
  .screen{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

  /* ---------- the top band, shared ---------- */
  .top{background:var(--green);color:var(--green-ink);padding:14px 40px 12px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex:none}
  .tophead{display:flex;align-items:center;gap:24px;min-width:0}
  .logo{width:104px;height:104px;flex:none;object-fit:contain;background:var(--green-ink);border-radius:50%;padding:8px}
  .top h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:52px;margin:0;line-height:1;letter-spacing:.01em}
  .eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:19px;opacity:.85}
  .event{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:27px;opacity:.9;margin-top:1px}
  .top .right{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:600;text-align:right;opacity:.92;white-space:nowrap;line-height:1.25}
  .top .right .warn{color:var(--gold-soft)}

  /* ---------- the board ---------- */
  .sun{background:var(--gold-soft);color:var(--gold);flex:none;padding:8px 40px;
    font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;letter-spacing:.04em;
    display:flex;align-items:baseline;gap:16px;white-space:nowrap;overflow:hidden}
  .sun .lab{text-transform:uppercase;letter-spacing:.12em;font-size:20px;opacity:.9}
  .sun .num{color:#7A560F;font-size:32px;font-weight:700}
  .sun .who{color:#7A560F;overflow:hidden;text-overflow:ellipsis}

  .cols{flex:1;min-height:0;padding:6px 44px 10px;display:grid;grid-template-columns:1fr;align-items:start;overflow:hidden}
  .col{min-width:0}
  tr.pad td{border-bottom:0}

  /* how long until the page turns */
  .prog{flex:none;height:8px;background:var(--green-soft);overflow:hidden}
  .prog .fill{height:100%;width:0;background:var(--green)}

  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:calc(19px * var(--k));color:var(--muted);text-align:right;padding:4px 5px;border-bottom:2px solid var(--line)}
  th.l{text-align:left}
  td{padding:calc(7px * var(--k)) 5px;border-bottom:1px solid var(--line);white-space:nowrap}
  td.pos{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:calc(38px * var(--k));color:var(--muted);text-align:right;width:calc(70px * var(--k))}
  td.team{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:calc(52px * var(--k));overflow:hidden;text-overflow:ellipsis;max-width:0;width:99%}
  td.r{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:calc(46px * var(--k));color:var(--ink);text-align:right;width:calc(92px * var(--k))}
  td.tot{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:calc(62px * var(--k));text-align:right;width:calc(130px * var(--k))}
  td.sn{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:calc(46px * var(--k));text-align:right;width:calc(100px * var(--k));color:var(--gold)}
  th{font-size:calc(24px * var(--k))}
  tr.lead td{background:var(--green-soft)}
  tr.lead td.pos,tr.lead td.tot{color:var(--green)}
  tr.sunlead td.sn{background:var(--gold-soft);font-weight:700}
  td.dash{color:var(--line);font-weight:500}

  /* ---------- entry ---------- */
  .pad{flex:1;min-height:0;overflow:auto;padding:14px 16px 120px;background:var(--bg)}
  .rounds{display:flex;gap:8px;padding:12px 16px 0;flex:none;background:var(--bg)}
  .rounds button{flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:24px;padding:14px 0;
    border:2px solid var(--line);background:var(--panel);color:var(--muted);border-radius:12px}
  .rounds button.on{background:var(--green);border-color:var(--green);color:var(--green-ink)}
  .count{padding:10px 16px 0;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:22px;color:var(--muted);background:var(--bg);flex:none}
  .row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
  .row .nm{flex:1;min-width:0;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:23px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .val{width:104px;flex:none;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:32px;text-align:center;
    padding:10px 4px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  .row.done .val{border-color:var(--green);color:var(--green)}
  .row .val.empty{color:var(--line)}

  /* the panel of the only values a match score can be */
  .sheet{position:fixed;inset:0;background:rgba(22,36,28,.55);display:flex;align-items:flex-end;z-index:60}
  .sheetin{background:var(--panel);width:100%;border-radius:20px 20px 0 0;padding:16px 14px 20px;max-height:88vh;overflow:auto}
  .sheetnm{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px}
  .sheetsub{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;color:var(--muted);margin-bottom:12px}
  .vals{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .vals button{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;padding:16px 0;
    border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  .vals button.on{background:var(--green);border-color:var(--green);color:var(--green-ink)}
  .sheetfoot{display:flex;gap:9px;margin-top:12px}
  .sheetfoot button{flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;padding:15px 0;
    border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted)}
  .steps{display:flex;gap:8px;margin:2px 0 10px}
  .steps button{flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;padding:11px 0;
    border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--muted)}
  .steps button.on{background:var(--green);border-color:var(--green);color:var(--green-ink)}
  .row.done{background:var(--green-soft);border-color:var(--green-soft)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--line);padding:12px 16px;display:flex;gap:10px}
  .bar button{flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:24px;padding:16px 0;border:0;border-radius:12px;background:var(--green);color:var(--green-ink)}
  .bar button.ghost{background:var(--panel);color:var(--green);border:2px solid var(--green);flex:0 0 40%}
  .note{padding:14px 16px 0;font-size:15px;color:var(--muted)}
  .setup{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px}
  .setup label{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:19px;color:var(--muted);margin-bottom:4px}
  .setup input{width:100%;font-size:16px;padding:10px;border:2px solid var(--line);border-radius:8px}

  .blank{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:40px}
  .blank .big{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:56px;line-height:1;color:var(--muted)}
  .blank .sub{font-size:22px;color:var(--muted);max-width:26em}

  /* a phone opening the board gets one column that scrolls */
  @media (max-width:899px){
    body{overflow:auto}
    .screen{height:auto;min-height:100vh}
    .top{padding:12px 14px;gap:12px}
    .logo{width:60px;height:60px;padding:5px}
    .top h1{font-size:27px}
    .event{font-size:16px}
    .eyebrow{font-size:13px}
    .top .right{font-size:15px}
    .sun{padding:7px 14px;font-size:19px;flex-wrap:wrap;white-space:normal}
    .sun .lab{font-size:15px}
    .cols{grid-template-columns:1fr;padding:8px 12px 24px;overflow:visible}
    .col+.col{border-left:0;padding-left:0;border-top:5px solid var(--green-soft);padding-top:10px}
    td.pos{font-size:18px;width:30px}
    td.team{font-size:21px}
    td.r{font-size:16px;width:30px}
    td.tot{font-size:25px;width:56px}
    td.sn{font-size:20px;width:46px}
  }
</style>
</head>
<body>
<div class="screen" id="screen"></div>
<script src="points.js"></script>
<script>
(function(){
  "use strict";
  var Pts = window.Points;

  /* The 25 teams, as Kyle sent them 2026-09-12. Fixed for the weekend: there
     is no roster screen, because there is nothing to change. mg/teams.json is
     the same list. */
  var TEAMS = [
    ["Ryan Wessendorf","Mike Grieder"],
    ["Gary Valimont","Carl Valimont"],
    ["Pete Heintz","Martin Pelatowski"],
    ["John Damiano","John Burke"],
    ["Scott Milford","Blake Tietze"],
    ["Nick Guiditta","Todd DeSaulniers"],
    ["Jay Rotatori","Joe Armington"],
    ["Jimmy Mengacci","Justin Reihl"],
    ["Luke Freimuth","Doug Lamond"],
    ["Tom McDonald","Will McDonald"],
    ["Tim Sullivan","Steve Sullivan"],
    ["Gene Fercodini","Kevin Greene"],
    ["Chuck Hill","Jeff Bradley"],
    ["BJ Paret","Rob Plasky"],
    ["Steve Shaker","Michael Shaker"],
    ["Bob Roscoe","Jeff Perkins"],
    ["Eddie Bushka","Zach Gorman"],
    ["Dave Jacoboski","Todd Volpe"],
    ["Steve Malagutti","Greg Balek"],
    ["Brian Godin","Ed Godin"],
    ["John Sheehy","Steve Paduano"],
    ["Frank Monteiro","Dave Martin"],
    ["Dave Bisaillon","Carmine Poletta"],
    ["Jeremy Greco","Tommy Daddona"],
    ["Kyle Vanderlick","Bob Marages"]
  ];

  var TITLE = "Vander-Total-Points Pot";
  /* The pot is run at every club event, so the event name is data, not code.
     Kyle types it once on the entry screen; it rides along to the TV. */
  var EVENT_DEFAULT = "3-Day Member Guest";
  var EVSTORE = "vtp_event";
  var STEPSTORE = "vtp_step", MAXSTORE = "vtp_max";
  var STORE = "vtp_2026";           /* its own key. The Mengacci app's round is
                                       stored under a different one and this page
                                       never reads or writes it. */
  var KEYSTORE = "vtp_key";         /* the posting key, this device only */

  /* The live channel, when there is one: the same Apps Script the Mengacci
     board uses (sync/README.md), with board=vtp so the two never collide.
     Empty until Kyle deploys it; ?api=<url> sets it without a redeploy. */
  var MG_API = "https://script.google.com/macros/s/AKfycbw756Fq3M4FB9zbR7FWhQiKMozAgSD2W6RjkImAC_4jg7x7l9ykjTzh4ZWUDZcNtbS_/exec";
  var EVERY = 20000, STALE = 120000;

  /* The board rotates. Kyle, 2026-09-12, standing in front of the club TV:
     the match scores were too small to read across the room. Type size is
     bounded by row height and row height is the screen divided by the rows on
     it, so the only way to make everything bigger is to show fewer teams at a
     time. Nine at a time over three pages is about 45% bigger type than 25 at
     once, and a 30-second cycle is a short wait to see your own team.
     ?rows=25 puts them all back on one page; ?secs=n changes the dwell. */
  var ROWS = 9, SECS = 10;
  if (/^\d+$/.test(q.get("rows") || "")) ROWS = Math.max(4, Math.min(25, +q.get("rows")));
  if (/^\d+$/.test(q.get("secs") || "")) SECS = Math.max(3, Math.min(120, +q.get("secs")));
  var page = 0, lastPosted = "";

  var q = new URLSearchParams(location.search);
  if (q.get("api")) MG_API = q.get("api");
  var ENTRY = q.get("enter") === "1";

  var round0 = 0;
  var points = load();
  preload();

  /* ?set=1&vals=3.5,3,1.5,... fills one whole match in team order and then
     takes itself out of the address bar, so a refresh cannot re-apply it.
     25 numbers typed by thumb is five minutes; a link is one tap. Typing them
     by hand still works and is the fallback whenever there is no link. */
  function preload(){
    var set = parseInt(q.get("set"), 10), vals = q.get("vals");
    if(!(set >= 1 && set <= 5) || !vals) return;
    var list = vals.split(",");
    if(list.length !== TEAMS.length) return;
    for(var i = 0; i < TEAMS.length; i++){
      var t = list[i].trim();
      var v = (t === "" || t === "-") ? null : Number(t);
      points[i][set-1] = Pts.onScale(v, getStep(), getMax()) ? v : null;
    }
    save();
    try{ history.replaceState(null, "", location.pathname + (ENTRY ? "?enter=1" : "")); }catch(e){}
    round0 = set - 1;
  }
  var lastPost = 0, lastOK = 0, everFetched = false, postState = "";

  /* ---------- storage ---------- */
  function blank(){ return TEAMS.map(function(){ return [null,null,null,null,null]; }); }
  function load(){
    try{
      var raw = localStorage.getItem(STORE);
      if(!raw) return blank();
      var p = JSON.parse(raw);
      if(!Array.isArray(p) || p.length !== TEAMS.length) return blank();
      return p.map(function(r){ r = Array.isArray(r)?r:[]; var o=[]; for(var k=0;k<5;k++) o.push(r[k]===undefined?null:r[k]); return o; });
    }catch(e){ return blank(); }
  }
  function save(){ try{ localStorage.setItem(STORE, JSON.stringify(points)); }catch(e){} }

  /* ---------- DOM helper ---------- */
  function h(tag, attrs, kids){
    var e = document.createElement(tag);
    if(attrs) for(var k in attrs){
      if(k === "text") e.textContent = attrs[k];
      else if(k === "class") e.className = attrs[k];
      else if(k.slice(0,2) === "on") e[k] = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids||[]).forEach(function(c){ if(c) e.appendChild(c); });
    return e;
  }
  function clock(ms){ var d=new Date(ms), hh=d.getHours()%12||12, m=d.getMinutes(); return hh+":"+(m<10?"0":"")+m; }

  function topBand(rightLines){
    /* Tapping the crest on the board goes to the entry screen, and on the
       entry screen goes back to the board. Kyle, 2026-09-12: "when I hit
       board I see it but how do i go back" — the Board button was a one-way
       door. Nothing is labelled, so the club TV shows no control at all. */
    return h("div",{class:"top"},[
      h("div",{class:"tophead"},[
        h("img",{class:"logo",src:"ccw-logo.png",alt:"Country Club of Waterbury",
          style:"cursor:pointer",
          onclick:function(){ location.href = ENTRY ? "./" : "./?enter=1"; }}),
        h("div",{},[
          h("div",{class:"eyebrow",text:"Country Club of Waterbury"}),
          h("h1",{text:TITLE}),
          h("div",{class:"event",text:getEvent()})
        ])
      ]),
      h("div",{class:"right"}, rightLines.map(function(l){
        return h("div", l.warn ? {class:"warn",text:l.text} : {text:l.text});
      }))
    ]);
  }

  /* ---------- the board ---------- */
  function renderBoard(){
    var rows = Pts.standings(TEAMS, points);
    var n = Pts.roundsIn(points);
    var scr = document.getElementById("screen");
    scr.innerHTML = "";

    var pagesFor = Math.max(1, Math.ceil(TEAMS.length / ROWS));
    /* A part-entered match must say so. Kyle can send at any point in a round,
       and "After match 3 of 5" with 12 of 25 in makes the other 13 look like
       they are losing when they simply are not on the sheet yet. Same rule as
       the Mengacci board: show what is in, and show what is still out. */
    var inThis = n ? Pts.entered(points, n-1) : 0;
    var part = n && inThis < TEAMS.length;
    var right = [{text: n ? (part ? "Match " + n + " coming in" : "After match " + n + " of 5")
                          : "No scores yet"}];
    if(part) right.push({text: inThis + " of " + TEAMS.length + " in", warn:true});
    if(n && pagesFor > 1) right.push({text: (page + 1) + " of " + pagesFor});
    if(MG_API){
      if(lastOK) right.push({text:"Updated " + clock(lastOK), warn:(Date.now()-lastOK > STALE)});
      else if(everFetched) right.push({text:"Waiting for scores"});
    } else {
      right.push({text:"25 teams"});
    }
    scr.appendChild(topBand(right));

    if(!n){
      scr.appendChild(h("div",{class:"blank"},[
        h("div",{class:"big",text:"No scores yet"}),
        h("div",{class:"sub",text:"The board fills in as each match comes in."})
      ]));
      return;
    }

    /* the Sunday money strip */
    var sunLeaders = Pts.leaders(rows,"sunday");
    var anySunday = rows.some(function(r){ return r.sundayPlayed > 0; });
    scr.appendChild(h("div",{class:"sun"},[
      h("span",{class:"lab",text:"Sunday money"}),
      anySunday ? h("span",{class:"num",text:String(sunLeaders[0].sunday)}) : null,
      h("span",{class:"who",text: anySunday
        ? sunLeaders.map(function(r){ return r.name; }).join("   ·   ")
        : "Matches 4 and 5"})
    ]));

    /* One full-width column, ROWS teams at a time. Every page renders the
       same number of rows — the short last page is padded with blanks — so the
       type never jumps size as it turns over. */
    var pages = Math.max(1, Math.ceil(rows.length / ROWS));
    if(page >= pages) page = 0;
    var part = rows.slice(page * ROWS, page * ROWS + ROWS);
    while(part.length < ROWS && pages > 1) part.push(null);

    var cols = h("div",{class:"cols"},[ h("div",{class:"col"},[table(part)]) ]);
    scr.appendChild(cols);

    if(pages > 1){
      var fill = h("div",{class:"fill"});
      scr.appendChild(h("div",{class:"prog"},[fill]));
      /* the bar runs the length of one dwell, so the room can see it is live
         and about to turn over rather than frozen */
      requestAnimationFrame(function(){
        fill.style.transition = "width " + SECS + "s linear";
        fill.style.width = "100%";
      });
    }
    fit(cols);
  }

  /* A TV is whatever height it is, and a row that falls off the bottom is a
     team that is not on the board. Shrink until all 25 fit. Only on a big
     screen: a phone scrolls, which is what a phone should do. */
  function fit(cols){
    var root = document.documentElement;
    root.style.setProperty("--k", "1");
    if(window.innerWidth < 900) return;      /* a phone scrolls, as it should */
    /* Measure against the bottom of the screen, not the container's own box:
       clientHeight includes padding, and believing it left the last team two
       pixels off the bottom of the TV. SAFE also buys a little room for a
       television that overscans. */
    /* A television crops the edge of the picture (overscan), so keep a real
       margin rather than 10px: 3% of the height, never less than 18px. */
    var SAFE = Math.max(18, Math.round(window.innerHeight * 0.03));
    var top = cols.getBoundingClientRect().top;
    var target = window.innerHeight - SAFE;
    function lowest(){
      var b = 0;
      [].forEach.call(cols.children, function(c){ b = Math.max(b, c.getBoundingClientRect().bottom); });
      return b;
    }
    var k = 1, guard = 0;
    while(lowest() > target && k > 0.45 && guard++ < 16){
      k = Math.max(0.45, k * Math.min(0.985, (target - top) / (lowest() - top)));
      root.style.setProperty("--k", String(k));
    }
  }

  function table(part){
    var head = h("tr",{},[
      h("th",{class:"l",text:""}), h("th",{class:"l",text:"Team"}),
      h("th",{text:"1"}),h("th",{text:"2"}),h("th",{text:"3"}),h("th",{text:"4"}),h("th",{text:"5"}),
      h("th",{text:"Tot"}), h("th",{text:"Sun"})
    ]);
    var body = part.map(function(r){
      if(!r) return h("tr",{class:"pad"},[h("td",{class:"team",text:"\u00a0"})]);
      var cells = [
        h("td",{class:"pos",text:String(r.rank)}),
        h("td",{class:"team",text:r.name})
      ];
      r.rounds.forEach(function(v){
        cells.push(h("td",{class:"r"+(v===null?" dash":""),text:show(v)}));
      });
      cells.push(h("td",{class:"tot",text:show(r.total)}));
      cells.push(h("td",{class:"sn",text:r.sundayPlayed?show(r.sunday):"–"}));
      return h("tr",{class:(r.rank===1?"lead ":"")+(r.sundayPlayed&&r.sunRank===1?"sunlead":"")},cells);
    });
    return h("table",{},[h("thead",{},[head]), h("tbody",{},body)]);
  }

  /* ---------- entry ---------- */
  function renderEntry(){
    var scr = document.getElementById("screen");
    scr.innerHTML = "";
    scr.appendChild(topBand([{text:"Entry"},{text:postState||(MG_API?"TV connected":"This phone only")}]));

    var rounds = h("div",{class:"rounds"});
    for(var k=0;k<5;k++)(function(k){
      rounds.appendChild(h("button",{class:(k===round0?"on":""),text:"Match "+(k+1),
        onclick:function(){ round0=k; renderEntry(); }}));
    })(k);
    scr.appendChild(rounds);
    scr.appendChild(h("div",{class:"count",id:"count",text:count()}));

    var pad = h("div",{class:"pad"});
    TEAMS.forEach(function(pair,i){
      pad.appendChild(h("div",{class:"row"+(points[i][round0]===null?"":" done"),id:"row"+i},[
        h("div",{class:"nm",text:Pts.teamName(pair)}),
        h("button",{class:"val"+(points[i][round0]===null?" empty":""),id:"val"+i,
          text:show(points[i][round0]), onclick:function(){ pick(i); }})
      ]));
    });

    var setup = h("div",{class:"setup"},[
      h("label",{text:"Event name — shows on the board"}),
      h("input",{type:"text",value:getEvent(),
        onchange:function(){ setEvent(this.value); renderEntry(); }}),
      h("label",{text:"TV key — type once, stays on this phone",style:"margin-top:12px"}),
      h("input",{type:"password",value:getKey(),placeholder:"the POST_KEY from the script",
        onchange:function(){ setKey(this.value); }}),
      h("label",{text:"Points scale — from the event rules sheet",style:"margin-top:12px"}),
      stepButtons(),
      h("input",{type:"number",inputmode:"numeric",value:String(getMax()),
        onchange:function(){ setMax(this.value); renderEntry(); }})
    ]);
    pad.appendChild(setup);
    pad.appendChild(h("div",{class:"note",text:"Tap a team to set its points. Saved on this phone straight away; Send to TV puts them on the club screen."}));
    scr.appendChild(pad);

    scr.appendChild(h("div",{class:"bar"},[
      h("button",{class:"ghost",text:(empty() ? "Get from TV" : "Board"),
        onclick:function(){ if(empty()) grab(); else location.href="./"; }}),
      h("button",{text:"Send to TV",onclick:post})
    ]));
  }
  function count(){ return Pts.entered(points, round0) + " of " + TEAMS.length + " in for match " + (round0+1); }
  function empty(){ return Pts.roundsIn(points) === 0; }

  /* Bring the scores back down from the channel. Kyle, 2026-09-12, after
     re-adding the app to his home screen: "downloaded it from safari and it
     wiped out all the scores". Nothing was lost — an iPhone home-screen app
     gets its own storage, so that copy opened with none. The channel is the
     copy that survives a phone, so entry can read it as well as write it.
     It only ever lands on an empty screen, so it cannot wipe work in hand. */
  function grab(){
    if(!MG_API){ flash("No TV address"); return; }
    flash("Getting…");
    fetch(MG_API + (MG_API.indexOf("?")>=0?"&":"?") + "board=vtp&t=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j && j.format === "vtp-live-v1" && Array.isArray(j.points) && j.points.length === TEAMS.length){
          if(!empty()){ flash("Not empty — nothing changed"); return; }
          points = j.points;
          if(j.event) setEvent(j.event);
          save();
          postState = "Got " + Pts.roundsIn(points) + " match(es) from the TV";
          renderEntry();
        } else {
          flash(j && j.empty ? "The TV has nothing yet" : "Nothing to get");
        }
      })
      .catch(function(e){ flash("Could not reach the TV: " + e.message); });
  }
  function show(v){ return v === null ? "–" : (v === Math.round(v) ? String(v) : v.toFixed(1)); }

  function stepButtons(){
    var box = h("div",{class:"steps"});
    Pts.STEPS.forEach(function(st){
      box.appendChild(h("button",{class:(Pts.step(getStep()) === st ? "on" : ""),
        text:(st === 1 ? "whole" : st === 0.5 ? "halves" : "quarters"),
        onclick:function(){ setStep(st); renderEntry(); }}));
    });
    return box;
  }

  /* the panel: every value a match score can be, and nothing else. No keyboard,
     so no typo and no number that is not on the scale. */
  function pick(i){
    var cur = points[i][round0];
    var grid = h("div",{class:"vals"});
    Pts.scale(getStep(), getMax()).forEach(function(v){
      grid.appendChild(h("button",{class:(cur === v ? "on" : ""), text:show(v),
        onclick:function(){ setVal(i, v); close(); }}));
    });
    var sheet = h("div",{class:"sheet",onclick:function(e){ if(e.target === sheet) close(); }},[
      h("div",{class:"sheetin"},[
        h("div",{class:"sheetnm",text:Pts.teamName(TEAMS[i])}),
        h("div",{class:"sheetsub",text:"Match " + (round0+1)}),
        grid,
        h("div",{class:"sheetfoot"},[
          h("button",{text:"Clear",onclick:function(){ setVal(i,null); close(); }}),
          h("button",{text:"Cancel",onclick:close})
        ])
      ])
    ]);
    function close(){ if(sheet.parentNode) sheet.parentNode.removeChild(sheet); }
    document.body.appendChild(sheet);
  }

  function setVal(i, v){
    points[i][round0] = Pts.onScale(v, getStep(), getMax()) ? Number(v) : null;
    save();
    var row = document.getElementById("row"+i), btn = document.getElementById("val"+i);
    if(row) row.className = "row" + (points[i][round0]===null?"":" done");
    if(btn){ btn.textContent = show(points[i][round0]); btn.className = "val" + (points[i][round0]===null?" empty":""); }
    var c = document.getElementById("count"); if(c) c.textContent = count();
  }
  function getStep(){ try{ return Pts.step(localStorage.getItem(STEPSTORE)); }catch(e){ return Pts.STEP; } }
  function setStep(v){ try{ localStorage.setItem(STEPSTORE, String(Pts.step(v))); }catch(e){} }
  function getMax(){ try{ return Pts.max(localStorage.getItem(MAXSTORE)); }catch(e){ return Pts.MAX; } }
  function setMax(v){ try{ localStorage.setItem(MAXSTORE, String(Pts.max(v))); }catch(e){} }
  function getEvent(){ try{ return localStorage.getItem(EVSTORE) || EVENT_DEFAULT; }catch(e){ return EVENT_DEFAULT; } }
  function setEvent(v){ try{ localStorage.setItem(EVSTORE, v.trim() || EVENT_DEFAULT); }catch(e){} }
  function getKey(){ try{ return localStorage.getItem(KEYSTORE)||""; }catch(e){ return ""; } }
  function setKey(v){ try{ localStorage.setItem(KEYSTORE, v); }catch(e){} }

  /* ---------- the channel ---------- */
  function post(){
    if(!MG_API){ flash("No TV address set yet"); return; }
    if(!getKey()){ flash("Type the TV key first"); return; }
    flash("Sending…");
    fetch(MG_API, {
      method:"POST", redirect:"follow",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ key:getKey(), board:"vtp", round:{
        format:"vtp-live-v1", title:TITLE, event:getEvent(), posted:new Date().toISOString(),
        teams:TEAMS, points:points
      }})
    }).then(function(r){ return r.json(); })
      .then(function(j){ flash(j && j.ok ? "Sent to TV" : "Not sent: " + ((j&&j.error)||"?")); })
      .catch(function(e){ flash("Not sent: " + e.message); });
  }
  function flash(m){ postState = m; var t = document.querySelector(".top .right"); if(t) t.lastChild.textContent = m; }

  function pull(){
    if(!MG_API) return;
    fetch(MG_API + (MG_API.indexOf("?")>=0?"&":"?") + "board=vtp&t=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(j){
        everFetched = true;
        if(j && j.format === "vtp-live-v1" && Array.isArray(j.points)){
          points = j.points;
          if(j.event) setEvent(j.event);
          lastOK = Date.now();
          /* only repaint when the scores actually changed, or every poll would
             restart the page turn and the board would never advance */
          if(j.posted !== lastPosted){ lastPosted = j.posted || ""; page = 0; renderBoard(); }
        } else if(j && j.empty && !lastPosted){ renderBoard(); }
      })
      .catch(function(){ everFetched = true; });
  }

  /* ---------- keep the television awake ----------
     Kyle, 2026-09-12: the stick blanked even with the screensaver set to
     Never. A page that looks idle gets put to sleep, so the board says it is
     in use, two ways, because Silk on a Fire TV is an old Chromium and may
     have neither:

       1. the Screen Wake Lock API, if it exists, re-taken whenever the tab
          comes back to the front (a lock is dropped when it is hidden);
       2. failing that, a tone far below hearing. A device with audio playing
          is a device in use. It needs a user gesture to start, which the
          first remote press supplies, so it arms itself on the first key or
          click and not before.

     Neither is guaranteed on this hardware. It is a nudge, not a promise, and
     the TV's own energy saver is a separate setting on the TV. */
  function keepAwake(){
    var lock = null;
    function take(){
      try{
        if(navigator.wakeLock && navigator.wakeLock.request){
          navigator.wakeLock.request("screen").then(function(l){
            lock = l;
            l.addEventListener("release", function(){ lock = null; });
          }).catch(function(){});
        }
      }catch(e){}
    }
    take();
    document.addEventListener("visibilitychange", function(){
      if(!document.hidden && !lock) take();
    });

    var ctx = null;
    function tone(){
      if(ctx) { if(ctx.state === "suspended") ctx.resume(); return; }
      try{
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        ctx = new AC();
        var osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.frequency.value = 60;          /* low, and at this gain inaudible */
        gain.gain.value = 0.0008;
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start();
      }catch(e){ ctx = null; }
    }
    ["keydown","click","touchstart","mousemove"].forEach(function(ev){
      document.addEventListener(ev, tone, {once:false, passive:true});
    });
    document.addEventListener("visibilitychange", function(){ if(!document.hidden) tone(); });
  }

  /* ---------- go ---------- */
  if(ENTRY){
    renderEntry();
    if(MG_API && Pts.roundsIn(points) === 0) grab();   /* a fresh phone fills itself */
  }
  else{
    renderBoard();
    keepAwake();
    window.addEventListener("resize", function(){ renderBoard(); });
    /* turn the page */
    if(Math.ceil(TEAMS.length / ROWS) > 1){
      setInterval(function(){ page++; renderBoard(); }, SECS * 1000);
    }
    /* Measure again once the web font has actually arrived. Barlow Condensed
       loads after the first paint and the rows grow when it lands, which is
       what pushed the last teams off the bottom of the club TV on
       2026-09-12. The timers cover a browser with no document.fonts. */
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ renderBoard(); });
    setTimeout(renderBoard, 600);
    setTimeout(renderBoard, 2500);
    if(MG_API){ pull(); setInterval(pull, EVERY); }
    setInterval(function(){ if(MG_API) renderBoard(); }, 60000);
  }
})();
</script>
</body>
</html>

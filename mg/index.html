<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E5A3C">
<title>Vander-Total-Points Pot</title>
<link rel="icon" href="ccw-logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  /* Two screens in one file: the BOARD (the club TV, and any phone that opens
     this address) and ENTRY (?enter=1, Kyle's phone). The arithmetic is in
     points.js, which both load; the saved record is record.js. Read from
     across a room: one type scale, no instructions on the board, nothing that
     scrolls on a TV. */
  :root{
    --bg:#E9EFE8; --panel:#FBFCFA; --ink:#16241C; --muted:#5C6B61; --line:#CBD6CD;
    --green:#1E5A3C; --green-ink:#F4F8F4; --green-soft:#DCEADF;
    --gold:#A8781F; --gold-soft:#F5EBD3;
    --k:1;                     /* the board shrinks to the screen: see fit() */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--panel);color:var(--ink);
    font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.35;
    overflow:hidden}
  .screen{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

  /* ---------- the top band, shared ---------- */
  .top{background:var(--green);color:var(--green-ink);padding:14px 40px 12px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex:none}
  .tophead{display:flex;align-items:center;gap:24px;min-width:0}
  .logo{width:104px;height:104px;flex:none;object-fit:contain;background:var(--green-ink);border-radius:50%;padding:8px}
  .top h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:52px;margin:0;line-height:1;letter-spacing:.01em}
  .eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:19px;opacity:.85}
  .event{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:27px;opacity:.9;margin-top:1px}
  .top .right{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:600;text-align:right;opacity:.92;white-space:nowrap;line-height:1.25}
  .top .right .warn{background:var(--gold);color:#1B1408;font-weight:700;padding:3px 12px;border-radius:999px;display:inline-block}

  /* ---------- the board ---------- */
  .sun{background:var(--gold-soft);color:var(--gold);flex:none;padding:8px 40px;
    font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;letter-spacing:.04em;
    display:flex;align-items:baseline;gap:16px;white-space:nowrap;overflow:hidden}
  .sun .lab{text-transform:uppercase;letter-spacing:.12em;font-size:20px;opacity:.9}
  .sun .num{color:#7A560F;font-size:32px;font-weight:700}
  .sun .who{color:#7A560F;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .sun .why{color:#8A6A2A;font-weight:600;font-size:20px;opacity:.85;white-space:nowrap}
  /* the prize money sits at the right end of the banner, once marked final */
  .sun .amt{margin-left:auto;flex:none;padding-left:24px;font-size:34px;color:#7A560F}
  /* the main pot's turns of the banner, in the pot's green */
  .sun.pot{background:var(--green-soft);color:var(--green)}
  .sun.pot .num,.sun.pot .who,.sun.pot .amt{color:var(--green)}

  .cols{flex:1;min-height:0;padding:6px 44px 10px;display:grid;grid-template-columns:1fr;align-items:start;overflow:hidden}
  .col{min-width:0}
  tr.blankrow td{border-bottom:0;background:transparent}

  /* how long until the page turns */
  .prog{flex:none;height:8px;background:var(--green-soft);overflow:hidden}
  .prog .fill{height:100%;width:0;background:var(--green)}

  /* WIDTHS ARE SHARES, NOT PIXELS, and they add to 100 — Pts.shares() works
     them out for 5 or 7 matches, with or without a second pot, and the gate
     does the arithmetic. Kyle's phone, 2026-09-12: "all the names are gone" —
     the columns were fixed pixels wider than the screen, and the team column
     was left with nothing. table-layout:fixed makes the browser obey the
     shares exactly, and makes every page of the rotation line up. */
  table{width:100%;table-layout:fixed;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:calc(24px * var(--k));color:var(--muted);text-align:right;padding:4px 5px;border-bottom:2px solid var(--line);white-space:nowrap;overflow:hidden}
  th.l{text-align:left}
  td{padding:calc(7px * var(--k)) 5px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
  td.pos{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:calc(38px * var(--k));color:var(--muted);text-align:right}
  td.team{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:calc(52px * var(--k));text-overflow:ellipsis}
  td.r{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:calc(46px * var(--k));color:var(--ink);text-align:right}
  td.tot{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:calc(62px * var(--k));text-align:right}
  /* The second pot reads as big as the total — Kyle, 2026-09-12: "make the
     font for Sunday money as big as that for total points, but keep the color
     that brownish". The row height is already set by the total. */
  td.sn{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:calc(62px * var(--k));text-align:right;color:var(--gold)}
  /* a team paid in the main pot cannot win the second: its points are still
     shown, because they are a fact, but never in the money colour */
  td.sn.out{color:var(--muted);opacity:.5}
  tr.lead td{background:var(--green-soft)}
  tr.lead td.pos,tr.lead td.tot{color:var(--green)}
  tr.sunlead td.sn{background:var(--gold-soft);font-weight:700}
  /* the second pot's leaders' names in brown too, so a six-way tie can be
     found in the list. Kyle, 2026-09-13: "fix yes, brown yes". */
  tr.sunlead td.team{color:#7A560F;background:var(--gold-soft)}
  td.dash{color:var(--line);font-weight:500}

  /* ---------- entry ---------- */
  .pad{flex:1;min-height:0;overflow:auto;padding:14px 16px 120px;background:var(--bg)}
  .tabs{display:flex;gap:8px;padding:12px 16px 0;flex:none;background:var(--bg)}
  .tabs button{flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:24px;padding:12px 0;
    border:2px solid var(--line);background:var(--panel);color:var(--muted);border-radius:12px}
  .tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--green-ink)}
  .rounds{display:flex;gap:6px;padding:10px 16px 0;flex:none;background:var(--bg);align-items:stretch}
  .rounds .lab{align-self:center;flex:none;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;color:var(--muted);padding-right:4px}
  .rounds button{flex:1;min-width:0;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;padding:12px 0;
    border:2px solid var(--line);background:var(--panel);color:var(--muted);border-radius:12px}
  .rounds button.on{background:var(--green);border-color:var(--green);color:var(--green-ink)}
  .count{padding:10px 16px 0;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:22px;color:var(--muted);background:var(--bg);flex:none}
  .row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
  .row .nm{flex:1;min-width:0;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:23px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .val{width:104px;flex:none;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:32px;text-align:center;
    padding:10px 4px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  .row.done .val{border-color:var(--green);color:var(--green)}
  .row .val.empty{color:var(--line)}
  .row.done{background:var(--green-soft);border-color:var(--green-soft)}

  /* the Teams tab: two names a team, typed or checked against the sheet */
  .trow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px}
  .trow .n{flex:none;width:30px;text-align:right;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;color:var(--muted)}
  .trow .names{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .trow input{width:100%;min-width:0;font-size:17px;padding:9px 10px;border:2px solid var(--line);border-radius:8px;background:#fff}
  .trow .x{flex:none;width:46px;height:46px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--muted);font-size:24px;line-height:1}
  .warnbox{background:var(--gold-soft);color:#7A560F;border-radius:10px;padding:10px 12px;margin-top:10px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px}
  .bigbtn{display:block;width:100%;margin-top:10px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;padding:14px 0;
    border:2px solid var(--green);border-radius:12px;background:var(--panel);color:var(--green)}
  .bigbtn.solid{background:var(--green);color:var(--green-ink)}
  .bigbtn.quiet{border-color:var(--line);color:var(--muted)}

  /* the panel of the only values a match score can be, and the confirm sheets */
  .sheet{position:fixed;inset:0;background:rgba(22,36,28,.55);display:flex;align-items:flex-end;z-index:60}
  .sheetin{background:var(--panel);width:100%;border-radius:20px 20px 0 0;padding:16px 14px 20px;max-height:88vh;overflow:auto}
  .sheetnm{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px}
  .sheetsub{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;color:var(--muted);margin-bottom:12px}
  .vals{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .vals button{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;padding:16px 0;
    border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  .vals button.on{background:var(--green);border-color:var(--green);color:var(--green-ink)}
  .sheetfoot{display:flex;gap:9px;margin-top:12px}
  .sheetfoot button{flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;padding:15px 0;
    border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted)}
  .sheetfoot button.save{background:var(--green);border-color:var(--green);color:var(--green-ink)}
  /* one tap: 0 to 9 in half steps, a Minus toggle, and Other for the pad */
  .minus{display:block;width:100%;margin:0 0 9px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:24px;padding:10px 0;
    border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted)}
  .minus.on{background:var(--ink);border-color:var(--ink);color:var(--green-ink)}
  .tap{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tap button{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;padding:11px 0;
    border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  .tap button.on{background:var(--green);border-color:var(--green);color:var(--green-ink)}
  .tap button.other{font-size:22px;color:var(--green);border-color:var(--green);background:var(--green-soft)}
  /* the pad behind Other */
  .padshow{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:46px;line-height:1.05;text-align:center;padding:2px 0 6px;color:var(--ink)}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .keys button{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:32px;padding:9px 0;
    border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  .steps{display:flex;gap:8px;margin:2px 0 10px}
  .steps button{flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;padding:11px 0;
    border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--muted)}
  .steps button.on{background:var(--green);border-color:var(--green);color:var(--green-ink)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--line);padding:12px 16px;display:flex;gap:10px}
  .bar button{flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:24px;padding:16px 0;border:0;border-radius:12px;background:var(--green);color:var(--green-ink)}
  .bar button.ghost{background:var(--panel);color:var(--green);border:2px solid var(--green);flex:0 0 40%}
  .note{padding:14px 16px 0;font-size:15px;color:var(--muted)}
  .setup{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px}
  .setup .sect{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;color:var(--ink);margin:4px 0 8px}
  .setup label{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:19px;color:var(--muted);margin-bottom:4px}
  .setup input{width:100%;font-size:16px;padding:10px;border:2px solid var(--line);border-radius:8px}

  .blank{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:40px}
  /* the page's version, small, bottom right of the board: is the club TV on the reload? */
  .stamp{position:fixed;right:10px;bottom:6px;font-size:13px;color:var(--muted);opacity:.7;pointer-events:none}
  .blank .big{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:56px;line-height:1;color:var(--muted)}
  .blank .sub{font-size:22px;color:var(--muted);max-width:26em}

  /* a phone opening the board gets one column that scrolls */
  @media (max-width:899px){
    body{overflow:auto}
    .screen{height:auto;min-height:100vh}
    .top{padding:12px 14px;gap:12px}
    .logo{width:60px;height:60px;padding:5px}
    .top h1{font-size:27px}
    .event{font-size:16px}
    .eyebrow{font-size:13px}
    /* A long message ("3 teams from the link — check them against the
       sheet") must wrap, not push the whole screen wider than the phone:
       nowrap here made every box and button on the page run off the right. */
    .top .right{font-size:15px;white-space:normal;min-width:0;max-width:42%}
    .sun{padding:7px 14px;font-size:19px;flex-wrap:wrap;white-space:normal}
    .sun .lab{font-size:15px}
    .cols{grid-template-columns:1fr;padding:8px 12px 24px;overflow:visible}
    th{font-size:13px}
    td.pos{font-size:18px}
    td.team{font-size:21px}
    td.r{font-size:16px}
    td.tot{font-size:25px}
    td.sn{font-size:25px}
  }
</style>
</head>
<body>
<div class="screen" id="screen"></div>
<script src="points.js?v=2b28e832fd"></script>
<script src="record.js?v=35df223091"></script>
<script>
(function(){
  "use strict";
  var Pts = window.Points || {};

  /* A cached points.js is the one way this page can white-screen: index.html
     updates, the browser keeps yesterday's rules file, and the first call to
     something new throws before anything is drawn. Kyle, 2026-09-12: "my
     desktop icon is now broke / shows white screen". deploy.js stamps the
     script tags with a hash so that cannot happen, and these fallbacks mean
     that even if it does, the board draws — a 5-match, 1-place event. */
  if(!Pts.rows) Pts.rows = function(v){ v = parseInt(v,10); return (v>=4&&v<=100)?v:9; };
  if(!Pts.secs) Pts.secs = function(v){ v = parseInt(v,10); return (v>=3&&v<=120)?v:10; };
  if(!Pts.ROWS_DEFAULT) Pts.ROWS_DEFAULT = 9;
  if(!Pts.SECS_DEFAULT) Pts.SECS_DEFAULT = 10;
  if(!Pts.ROWS_CHOICES) Pts.ROWS_CHOICES = [6,9,13,100];
  if(!Pts.SECS_CHOICES) Pts.SECS_CHOICES = [5,10,15,20,30];
  if(!Pts.score) Pts.score = function(v){ if(v===null||v===undefined) return null;
    var s=String(v).trim().replace(/−/g,"-"); if(!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return null; return Number(s); };
  if(!Pts.purse) Pts.purse = function(n){ return { teams:n, entries:n*100, typed:0, diff:-n*100 }; };
  /* a stale rules file never shows money: the check it would need is missing */
  if(!Pts.moneyReady) Pts.moneyReady = function(){ return false; };
  if(!Pts.moneyProblems) Pts.moneyProblems = function(){ return ["The phone needs the new version: close and reopen the app"]; };
  if(!Pts.money) Pts.money = function(v){ v=Math.floor(Number(v)); return (isFinite(v)&&v>0&&v<=1000000)?v:0; };
  if(!Pts.share) Pts.share = function(t,n){ t=Pts.money(t); n=parseInt(n,10); return (t&&n>0)?Math.floor(t/n):0; };
  if(!Pts.dollars) Pts.dollars = function(v){ return "$"+String(v).replace(/\B(?=(\d{3})+(?!\d))/g,","); };
  if(!Pts.rounds) Pts.rounds = function(){ return 5; };
  if(!Pts.places) Pts.places = function(){ return 1; };
  if(!Pts.ROUND_CHOICES) Pts.ROUND_CHOICES = [5];
  if(!Pts.PLACE_CHOICES) Pts.PLACE_CHOICES = [1];
  if(!Pts.secondName) Pts.secondName = function(v){ return String(v||"").trim() || "Sunday money"; };
  if(!Pts.cleanTeams) Pts.cleanTeams = function(l){ return (l||[]).map(function(p){ return [String((p||[])[0]||"").trim(), String((p||[])[1]||"").trim()]; }); };
  if(!Pts.duplicates) Pts.duplicates = function(){ return []; };
  if(!Pts.setup) Pts.setup = function(j){ j=j||{}; return { rounds:5, places:1, prizes:[Pts.money(j.pot),0,0],
    second:{ on:true, name:"Sunday money", amount:Pts.money(j.sun) }, final:j.final===true }; };
  if(!Pts.shares) Pts.shares = function(){ return { pos:6, team:32, r:7, tot:14, sun:13 }; };
  if(!Pts.payout) Pts.payout = function(){ return { main:[], second:null, byTeam:{} }; };
  if(!Pts.placeName) Pts.placeName = function(p){ return ["","1st","2nd","3rd"][p] || (p+"th"); };

  /* A phone starts with NO teams: the next event has its own field, typed on
     the Teams tab, filled from a link, or taken from the TV. Until 2026-09-13
     it started with the 25 teams of the 3-Day Member Guest, a wrong roster
     Kyle would have had to notice and clear (Fable's review). That list is
     still mg/teams.json, which the Mengacci board's stand-in feed uses. */
  var TEAMS_DEFAULT = [];
  var TEAMS_2026_09_12 = [
    ["Ryan Wessendorf","Mike Grieder"],
    ["Gary Valimont","Carl Valimont"],
    ["Pete Heintz","Martin Pelatowski"],
    ["John Damiano","John Burke"],
    ["Scott Milford","Blake Tietze"],
    ["Nick Guiditta","Todd DeSaulniers"],
    ["Jay Rotatori","Joe Armington"],
    ["Jimmy Mengacci","Justin Reihl"],
    ["Luke Freimuth","Doug Lamond"],
    ["Tom McDonald","Will McDonald"],
    ["Tim Sullivan","Steve Sullivan"],
    ["Gene Fercodini","Kevin Greene"],
    ["Chuck Hill","Jeff Bradley"],
    ["BJ Paret","Rob Plasky"],
    ["Steve Shaker","Michael Shaker"],
    ["Bob Roscoe","Jeff Perkins"],
    ["Eddie Bushka","Zach Gorman"],
    ["Dave Jacoboski","Todd Volpe"],
    ["Steve Malagutti","Greg Balek"],
    ["Brian Godin","Ed Godin"],
    ["John Sheehy","Steve Paduano"],
    ["Frank Monteiro","Dave Martin"],
    ["Dave Bisaillon","Carmine Poletta"],
    ["Jeremy Greco","Tommy Daddona"],
    ["Kyle Vanderlick","Bob Marages"]
  ];

  /* The title is Kyle's to type. He runs this pool at every club event and
     the name is not the code's business. 2026-09-12: "The title should say ...
     Do i get to change that myself?" — yes. */
  var TITLE_DEFAULT = "Vander-Total-Points Pot";
  var TITLESTORE = "vtp_title";
  /* The event name is data, not code. Kyle types it on the Setup tab; it
     rides along to the TV. A new tournament empties it. */
  var EVENT_DEFAULT = "3-Day Member Guest";
  var EVSTORE = "vtp_event";
  var ROWSTORE = "vtp_rows", SECSTORE = "vtp_secs";
  var FINALSTORE = "vtp_final";
  /* the shape of the event, and the money (2026-09-13) */
  var TEAMSTORE = "vtp_teams", ROUNDSTORE = "vtp_rounds", PLACESTORE = "vtp_places",
      PRIZESTORE = "vtp_prizes", SECONDSTORE = "vtp_second";
  var POTSTORE = "vtp_pot", SUNSTORE = "vtp_sun";   /* before paid places: read once, to carry over */
  var STORE = "vtp_2026";           /* its own key. The Mengacci app's round is
                                       stored under a different one and this page
                                       never reads or writes it. */
  var KEYSTORE = "vtp_key";         /* the posting key, this device only */
  var NROWS = 7;                    /* every team's scores hold 7 matches, so
                                       switching 7 to 5 and back loses nothing */

  /* The live channel: the same Apps Script the Mengacci board uses
     (sync/README.md), with board=vtp so the two never collide. ?api=<url>
     sets it without a redeploy. */
  var MG_API = "https://script.google.com/macros/s/AKfycbw756Fq3M4FB9zbR7FWhQiKMozAgSD2W6RjkImAC_4jg7x7l9ykjTzh4ZWUDZcNtbS_/exec";
  var EVERY = 20000, STALE = 120000;

  /* Which version this page is: shown small on the board and in Setup, and
     in the tab title, so "did the club TV take the reload?" has an answer
     (Fable's review, 2026-09-13). Bump it when the page changes. */
  var MG_VERSION = "v2.1";
  var q = new URLSearchParams(location.search);
  if (q.get("api")) MG_API = q.get("api");
  var ENTRY = q.get("enter") === "1";
  try{ document.title = (ENTRY ? "Points pot entry" : "Points pot board") + " · " + MG_VERSION; }catch(e){}

  /* The board rotates. Kyle, 2026-09-12, standing in front of the club TV:
     the match scores were too small to read across the room. Type size is
     bounded by row height and row height is the screen divided by the rows on
     it, so the only way to make everything bigger is to show fewer teams at a
     time. ?rows=n and ?secs=n still override, for a seat testing a size. */
  var ROWS = Pts.ROWS_DEFAULT, SECS = Pts.SECS_DEFAULT;
  var rowsLocked = /^\d+$/.test(q.get("rows") || ""), secsLocked = /^\d+$/.test(q.get("secs") || "");
  if (rowsLocked) ROWS = Pts.rows(q.get("rows"));
  if (secsLocked) SECS = Pts.secs(q.get("secs"));
  try{
    if(!rowsLocked && localStorage.getItem("vtp_rows")) ROWS = Pts.rows(localStorage.getItem("vtp_rows"));
    if(!secsLocked && localStorage.getItem("vtp_secs")) SECS = Pts.secs(localStorage.getItem("vtp_secs"));
  }catch(e){}
  var page = 0, lastPosted = "", pageTimer = null;
  /* the banner's turn, counted apart from the page: see renderBoard */
  var turn = 0;

  /* The teams, the scores and the set-up. On the phone they are the phone's
     own; the board replaces all three with what the channel carries. */
  var TEAMS = getTeams();
  var SETUP = localSetup();
  var tab = (q.get("tab") === "teams" || q.get("tab") === "setup") ? q.get("tab") : "scores";
  var round0 = 0;
  var points = load();
  var lastPost = 0, lastOK = 0, everFetched = false, postState = "";
  preload();
  preloadTeams();

  /* ?set=1&vals=3.5,3,1.5,... fills one whole match in team order and then
     takes itself out of the address bar, so a refresh cannot re-apply it. */
  function preload(){
    var set = parseInt(q.get("set"), 10), vals = q.get("vals");
    if(!(set >= 1 && set <= SETUP.rounds) || !vals) return;
    var list = vals.split(",");
    if(list.length !== TEAMS.length) return;
    for(var i = 0; i < TEAMS.length; i++){
      points[i][set-1] = Pts.score(list[i]);
    }
    save();
    try{ history.replaceState(null, "", location.pathname + (ENTRY ? "?enter=1" : "")); }catch(e){}
    round0 = set - 1;
  }

  /* ?teams=Ann Smith/Bob Jones;Cal Lee/Dan Poe fills the Teams tab — how a seat
     hands Kyle a list it read off a photo of the pairing sheet, for him to
     check against the paper. Kyle, 2026-09-13: "When people want in I circle
     their names. Then can you create the team list somehow?" It never lands on
     a phone that has scores: that would put this weekend's points against
     next weekend's names. */
  function preloadTeams(){
    var raw = q.get("teams");
    if(!raw || !ENTRY) return;
    try{ history.replaceState(null, "", location.pathname + "?enter=1"); }catch(e){}
    if(!empty()){ postState = "Teams link not used: this phone still has scores. Start a new tournament first."; tab = "setup"; return; }
    var list = Pts.cleanTeams(raw.split(";").map(function(t){ return t.split("/"); }))
      .filter(function(p){ return p[0] || p[1]; });
    if(!list.length) return;
    TEAMS = list; setTeams(TEAMS);
    points = fitPoints([], TEAMS.length); save();
    tab = "teams";
    postState = list.length + " teams from the link — check them against the sheet";
  }

  /* ---------- storage ---------- */
  function fitPoints(p, n){
    p = Array.isArray(p) ? p : [];
    var out = [];
    for(var i = 0; i < n; i++){
      var r = Array.isArray(p[i]) ? p[i] : [], o = [];
      for(var k = 0; k < NROWS; k++) o.push((r[k] === undefined || r[k] === "") ? null : r[k]);
      out.push(o);
    }
    return out;
  }
  function load(){
    try{ var raw = localStorage.getItem(STORE); return fitPoints(raw ? JSON.parse(raw) : [], TEAMS.length); }
    catch(e){ return fitPoints([], TEAMS.length); }
  }
  function save(){ try{ localStorage.setItem(STORE, JSON.stringify(points)); }catch(e){} }

  /* ---------- DOM helper ---------- */
  function h(tag, attrs, kids){
    var e = document.createElement(tag);
    if(attrs) for(var k in attrs){
      if(k === "text") e.textContent = attrs[k];
      else if(k === "class") e.className = attrs[k];
      else if(k.slice(0,2) === "on") e[k] = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids||[]).forEach(function(c){ if(c) e.appendChild(c); });
    return e;
  }
  function clock(ms){ var d = new Date(ms), h = d.getHours(), m = d.getMinutes();
    return (h%12||12) + ":" + (m<10?"0":"") + m + (h<12 ? "am" : "pm"); }
  /* a quarter shows as a quarter: 6.25, not 6.3 */
  function show(v){ return v === null ? "–" : String(Math.round(v * 100) / 100); }

  /* The board shows the names the TV was last sent; the entry screen shows
     what this phone has typed. Neither overwrites the other. */
  var TV_NAMES = { title:"", event:"" };
  function shownTitle(){ return (!ENTRY && TV_NAMES.title) || getTitle(); }
  function shownEvent(){ return (!ENTRY && TV_NAMES.event) || getEvent(); }
  function retitle(){
    var t = document.querySelector(".top h1"), e = document.querySelector(".top .event");
    if(t) t.textContent = shownTitle();
    if(e) e.textContent = shownEvent();
  }
  function topBand(rightLines){
    /* Tapping the crest on the board goes to the entry screen, and on the
       entry screen goes back to the board. Kyle, 2026-09-12: "when I hit
       board I see it but how do i go back". Nothing is labelled, so the club
       TV shows no control at all. */
    return h("div",{class:"top"},[
      h("div",{class:"tophead"},[
        h("img",{class:"logo",src:"ccw-logo.png",alt:"Country Club of Waterbury",
          style:"cursor:pointer",
          onclick:function(){ location.href = ENTRY ? "./" : "./?enter=1"; }}),
        h("div",{},[
          h("div",{class:"eyebrow",text:"Country Club of Waterbury"}),
          h("h1",{text:shownTitle()}),
          h("div",{class:"event",text:shownEvent()})
        ])
      ]),
      h("div",{class:"right"}, rightLines.map(function(l){
        return h("div", l.warn ? {class:"warn",text:l.text} : {text:l.text});
      }))
    ]);
  }

  /* ---------- the board ---------- */
  var PLACE_WORDS = ["", "First", "Second", "Third"];
  function renderBoard(){
    var R = SETUP.rounds, N = SETUP.places, S2 = SETUP.second;
    var rows = Pts.standings(TEAMS, points, { rounds:R, places:N, second:S2.on, prizes:SETUP.prizes });
    var n = Pts.roundsIn(points, R);
    var scr = document.getElementById("screen");
    scr.innerHTML = "";

    /* teams a page: the setting, unless this screen cannot hold that many —
       then more pages, never a team off the bottom (see fit) */
    var PER = Math.min(ROWS, rowCap);
    var pagesFor = Math.max(1, Math.ceil(TEAMS.length / PER));
    /* A part-entered match must say so. "After match 3 of 5" with 12 of 25 in
       makes the other 13 look like they are losing when they simply are not on
       the sheet yet. Show what is in, and show what is still out. */
    var inThis = n ? Pts.entered(points, n-1) : 0;
    var part = n && inThis < TEAMS.length;
    var right = [{text: n ? (part ? "Match " + n + " coming in" : "After match " + n + " of " + R)
                          : "No scores yet"}];
    if(part) right.push({text: inThis + " of " + TEAMS.length + " in", warn:true});
    if(n && pagesFor > 1) right.push({text: (page + 1) + " of " + pagesFor});
    if(MG_API){
      /* a frozen board must say so in a way that reads across the room: a solid
         gold block, not a tint of white (Fable's review, 2026-09-13) */
      var stale = lastOK && (Date.now()-lastOK > STALE);
      if(lastOK) right.push({text:(stale ? "NOT UPDATING · scores as of " : "Updated ") + clock(lastOK), warn:stale});
      else if(everFetched) right.push({text:"Waiting for scores"});
    } else {
      right.push({text: TEAMS.length + " teams"});
    }
    scr.appendChild(topBand(right));
    scr.appendChild(h("div",{class:"stamp",text:MG_VERSION}));

    if(!n){
      scr.appendChild(h("div",{class:"blank"},[
        h("div",{class:"big",text:"No scores yet"}),
        h("div",{class:"sub",text:"The board fills in as each match comes in."})
      ]));
      return;
    }

    /* ONE BANNER, TAKING TURNS. Kyle, 2026-09-13: "One banner taking turns
       might be easiest" — a second banner would take height from the list.
       Until Final is sent it shows only the second pot ("the green banner
       names the top of the leaderboard without the tournament being done ...
       Just keep them shaded"), and the main pot's leaders are only the green
       rows. Once Final: each paid place of the main pot, then the second pot,
       one a turn, with the money at the right end — split among ties and
       rounded down. It turns on every turn of the page, not on the page
       number, so an odd number of pages still shows every banner. */
    var pay = Pts.payout(rows, { places:N, prizes:SETUP.prizes, second:S2 });
    var sunLeaders = S2.on ? Pts.leaders(rows,"sunday") : [];
    /* eligible teams only, the same test as the record, so the two cannot name
       different Sunday leaders */
    var anySunday = S2.on && rows.some(function(r){ return r.sunEligible && r.sundayPlayed > 0; });
    /* Say why only when the rule is actually biting: a team paid in the main
       pot has more second-pot points than the team in line for it. */
    var blocked = anySunday && sunLeaders.length && rows.some(function(r){
      return !r.sunEligible && r.sundayPlayed && r.sunday > sunLeaders[0].sunday;
    });
    function amt(each, count){
      return each ? h("span",{class:"amt",text:Pts.dollars(each) + (count > 1 ? " each" : "")}) : null;
    }
    /* Final sent AND the money adds up to $100 a team — checked here too, in
       case the money was changed after Final */
    var ready = Pts.moneyReady(teamCount(), SETUP);
    var turns = [];
    if(ready) pay.main.forEach(function(g){ turns.push({ main:g }); });
    if(S2.on) turns.push({ second:true });
    var t = turns.length ? turns[turn % turns.length] : null;
    if(t && t.main){
      var g = t.main;
      scr.appendChild(h("div",{class:"sun pot"},[
        /* a tie across places says so: "1st + 2nd — tie" */
        h("span",{class:"lab",text: g.places.length > 1
          ? g.places.map(Pts.placeName).join(" + ") + " — tie"
          : (PLACE_WORDS[g.start] || Pts.placeName(g.start)) + " place" + (g.teams.length > 1 ? " — tie" : "")}),
        h("span",{class:"num",text:show(g.teams[0].total)}),
        h("span",{class:"who",text:g.teams.map(function(r){ return r.name; }).join("   ·   ")}),
        amt(g.each, g.teams.length)
      ]));
    } else if(t && t.second){
      scr.appendChild(h("div",{class:"sun"},[
        h("span",{class:"lab",text:S2.name}),
        anySunday && sunLeaders.length ? h("span",{class:"num",text:show(sunLeaders[0].sunday)}) : null,
        h("span",{class:"who",text: anySunday && sunLeaders.length
          ? sunLeaders.map(function(r){ return r.name; }).join("   ·   ")
          : "Matches " + (R-1) + " and " + R}),
        blocked ? h("span",{class:"why",text:(N === 1 ? "pot winner not eligible" : "main pot winners not eligible")}) : null,
        ready ? amt(Pts.share(S2.amount, anySunday ? sunLeaders.length : 0), sunLeaders.length) : null
      ]));
    }

    /* One full-width column, ROWS teams at a time. Every page renders the
       same number of rows — the short last page is padded with blanks — so the
       type never jumps size as it turns over. */
    var pages = Math.max(1, Math.ceil(rows.length / PER));
    if(page >= pages) page = 0;
    var slice = rows.slice(page * PER, page * PER + PER);
    while(slice.length < PER && pages > 1) slice.push(null);

    var cols = h("div",{class:"cols"},[ h("div",{class:"col"},[table(slice)]) ]);
    scr.appendChild(cols);

    if(pages > 1){
      var fill = h("div",{class:"fill"});
      scr.appendChild(h("div",{class:"prog"},[fill]));
      /* the bar runs the length of one dwell, so the room can see it is live
         and about to turn over rather than frozen */
      requestAnimationFrame(function(){
        fill.style.transition = "width " + SECS + "s linear";
        fill.style.width = "100%";
      });
    }
    var fitting = fit(cols);
    /* Still too many at the smallest type: the checkers found "all" put 24 of
       40 teams below a 1920x1080 screen. Take as many as fit a page and turn
       pages instead, so every team is seen. */
    if(fitting >= 0 && fitting < slice.length && Math.max(4, fitting) < PER){
      rowCap = Math.max(4, fitting);
      renderBoard();
    }
  }

  /* A TV is whatever height it is, and a row that falls off the bottom is a
     team that is not on the board. Shrink until they fit. Only on a big
     screen: a phone scrolls, which is what a phone should do. Returns -1 when
     everything fits, otherwise how many rows fit at the smallest type. */
  var rowCap = 999, lastTeamCount = -1;
  function fit(cols){
    var root = document.documentElement;
    root.style.setProperty("--k", "1");
    if(window.innerWidth < 900) return -1;   /* a phone scrolls, as it should */
    /* Measure against the bottom of the screen, not the container's own box,
       and keep a real margin for a television that crops the edge of the
       picture (overscan): 3% of the height, never less than 18px. */
    var SAFE = Math.max(18, Math.round(window.innerHeight * 0.03));
    var top = cols.getBoundingClientRect().top;
    var target = window.innerHeight - SAFE;
    function lowest(){
      var b = 0;
      [].forEach.call(cols.children, function(c){ b = Math.max(b, c.getBoundingClientRect().bottom); });
      return b;
    }
    var k = 1, guard = 0;
    while(lowest() > target && k > 0.45 && guard++ < 16){
      k = Math.max(0.45, k * Math.min(0.985, (target - top) / (lowest() - top)));
      root.style.setProperty("--k", String(k));
    }
    if(lowest() <= target) return -1;
    return [].filter.call(cols.querySelectorAll("tbody tr"), function(tr){
      return tr.getBoundingClientRect().bottom <= target;
    }).length;
  }

  /* the second pot's column heading: "Sun" for Sunday money, otherwise the
     first word of its name */
  function secondHead(name){
    return /^sunday/i.test(name) ? "Sun" : String(name).split(/\s+/)[0].slice(0, 6);
  }

  function table(part){
    var R = SETUP.rounds, S2 = SETUP.second;
    /* One colgroup so the shares are declared once, from Pts.shares(). The
       team column is the widest share on purpose: a name is the only thing on
       this board that cannot be guessed from context. */
    var W = Pts.shares(R, S2.on, window.innerWidth < 900);
    var spec = [["pos", W.pos], ["team", W.team]];
    for(var k = 0; k < R; k++) spec.push(["r", W.r]);
    spec.push(["tot", W.tot]);
    if(S2.on) spec.push(["sn", W.sun]);
    var group = h("colgroup",{}, spec.map(function(c){ return h("col",{style:"width:" + c[1] + "%"}); }));
    var heads = [h("th",{class:"l",text:""}), h("th",{class:"l",text:"Team"})];
    for(k = 0; k < R; k++) heads.push(h("th",{text:String(k + 1)}));
    heads.push(h("th",{text:"Tot"}));
    if(S2.on) heads.push(h("th",{text:secondHead(S2.name)}));
    var head = h("tr",{}, heads);
    var body = part.map(function(r){
      /* A filler row keeps the last page the same height as the others. It
         carries the same cells as a real row, with the real cells' classes and
         a non-breaking space, so it is exactly as tall. Kyle, 2026-09-13: "i
         think the font size is changing from page 1 to page 2!!" — it was,
         because empty unpadded filler rows were zero pixels tall. */
      var NB = " ";
      if(!r) return h("tr",{class:"blankrow"}, spec.map(function(c){ return h("td",{class:c[0],text:NB}); }));
      var cells = [
        h("td",{class:"pos",text:String(r.rank)}),
        h("td",{class:"team",text:r.name})
      ];
      r.rounds.forEach(function(v){
        cells.push(h("td",{class:"r"+(v===null?" dash":""),text:show(v)}));
      });
      cells.push(h("td",{class:"tot",text:show(r.total)}));
      if(S2.on) cells.push(h("td",{class:"sn"+(r.sunEligible?"":" out"),text:r.sundayPlayed?show(r.sunday):"–"}));
      return h("tr",{class:(r.paidPlace?"lead ":"")+(S2.on&&r.sundayPlayed&&r.sunEligible&&r.sunRank===1?"sunlead":"")},cells);
    });
    return h("table",{},[group, h("thead",{},[head]), h("tbody",{},body)]);
  }

  /* ---------- entry ---------- */
  function renderEntry(){
    var scr = document.getElementById("screen");
    scr.innerHTML = "";
    scr.appendChild(topBand([{text:"Entry · " + MG_VERSION},{text:postState||(MG_API?"TV connected":"This phone only")}]));

    var tabs = h("div",{class:"tabs"});
    [["scores","Scores"],["teams","Teams"],["setup","Setup"]].forEach(function(t){
      tabs.appendChild(h("button",{class:(tab === t[0] ? "on" : ""), text:t[1],
        onclick:function(){ tidyTeams(); tab = t[0]; renderEntry(); }}));
    });
    scr.appendChild(tabs);

    if(tab === "teams") scr.appendChild(teamsTab());
    else if(tab === "setup") scr.appendChild(setupTab());
    else scoresTab(scr);

    scr.appendChild(h("div",{class:"bar"},[
      h("button",{class:"ghost",text:(empty() ? "Get from TV" : "Board"),
        onclick:function(){ if(empty()) grab(); else location.href="./"; }}),
      h("button",{text:"Send to TV",onclick:post})
    ]));
  }

  function scoresTab(scr){
    var R = SETUP.rounds;
    if(round0 >= R) round0 = 0;
    var rounds = h("div",{class:"rounds"},[h("span",{class:"lab",text:"Match"})]);
    for(var k=0;k<R;k++)(function(k){
      rounds.appendChild(h("button",{class:(k===round0?"on":""),text:String(k+1),
        onclick:function(){ round0=k; renderEntry(); }}));
    })(k);
    scr.appendChild(rounds);
    scr.appendChild(h("div",{class:"count",id:"count",text:count()}));

    var pad = h("div",{class:"pad"});
    if(!TEAMS.length) pad.appendChild(h("div",{class:"warnbox",text:"No teams yet. Add them on the Teams tab."}));
    TEAMS.forEach(function(pair,i){
      pad.appendChild(h("div",{class:"row"+(points[i][round0]===null?"":" done"),id:"row"+i},[
        h("div",{class:"nm",text:Pts.teamName(pair) || "Team " + (i+1)}),
        h("button",{class:"val"+(points[i][round0]===null?" empty":""),id:"val"+i,
          text:show(points[i][round0]), onclick:function(){ pick(i); }})
      ]));
    });
    pad.appendChild(h("div",{class:"note",text:"Tap a team to set its points. Saved on this phone straight away; Send to TV puts them on the club screen."}));
    scr.appendChild(pad);
  }

  /* THE TEAMS TAB. Kyle, 2026-09-13: "in case you go down, I need an option
     to enter the teams by hand." Two names a team, saved as typed. The boxes
     save without redrawing the screen, so a tap on Send to TV straight after
     typing is not lost (the same fault that ate a title change that morning). */
  function teamsTab(){
    var pad = h("div",{class:"pad"});
    pad.appendChild(h("div",{class:"count",style:"padding:0",text:TEAMS.length + (TEAMS.length === 1 ? " team" : " teams")}));
    /* filled here, while the box is still being built: looking it up by id
       before it is on the screen found nothing, and left an empty bar */
    var warn = h("div",{class:"warnbox",id:"dups"});
    pad.appendChild(warn);
    showDups(warn);
    TEAMS.forEach(function(pair, i){
      pad.appendChild(h("div",{class:"trow"},[
        h("div",{class:"n",text:String(i+1)}),
        h("div",{class:"names"},[
          h("input",{type:"text",value:pair[0],placeholder:"Player",autocapitalize:"words",
            onchange:function(){ TEAMS[i][0] = this.value.trim(); setTeams(TEAMS); showDups(); }}),
          h("input",{type:"text",value:pair[1],placeholder:"Player",autocapitalize:"words",
            onchange:function(){ TEAMS[i][1] = this.value.trim(); setTeams(TEAMS); showDups(); }})
        ]),
        h("button",{class:"x",text:"✕",onclick:function(){ removeTeam(i); }})
      ]));
    });
    pad.appendChild(h("button",{class:"bigbtn solid",text:"Add a team",onclick:function(){
      TEAMS.push(["",""]); points.push(fitPoints([], 1)[0]);
      setTeams(TEAMS); save(); renderEntry();
      var inputs = document.querySelectorAll(".trow input");
      if(inputs.length) try{ inputs[inputs.length - 2].focus(); }catch(e){}
    }}));
    pad.appendChild(h("div",{class:"note",text:"Two names a team, saved as you type. Send to TV puts the teams on the board. A photo of the circled sheet can also be turned into this list for you to check."}));
    return pad;
  }
  function showDups(el){
    var box = el || document.getElementById("dups");
    if(!box) return;
    var d = Pts.duplicates(TEAMS);
    box.textContent = d.length ? "Typed twice: " + d.join(", ") : "";
    box.hidden = !d.length;
    box.style.display = d.length ? "" : "none";
  }
  /* THE MONEY MUST ADD UP. Kyle, 2026-09-13: "Teams are always $100 per team.
     So the total payouts better match the math!" */
  /* every team that is in: named, or with a score (a team can be paid either way) */
  function teamCount(){ return TEAMS.filter(function(p, i){ return p[0] || p[1] || hasScores(i); }).length; }
  function purseText(c){
    return c.teams + (c.teams === 1 ? " team" : " teams") + " × " + Pts.dollars(Pts.ENTRY || 100) + " = " + Pts.dollars(c.entries) +
      ". Money typed: " + Pts.dollars(c.typed) +
      (c.diff === 0 ? " — it matches." : c.diff < 0 ? " — " + Pts.dollars(-c.diff) + " short." : " — " + Pts.dollars(c.diff) + " too much.");
  }
  function showPurse(el){
    var box = el || document.getElementById("purse");
    if(!box) return;
    var c = Pts.purse(teamCount(), localSetup()), bad = Pts.moneyProblems(teamCount(), localSetup());
    box.textContent = bad.length
      ? bad.join(". ") + "." + (getFinal() ? " Final is on: the TV keeps the money it was last sent, and shows none if this is sent as it is." : "")
      : purseText(c);
    box.className = bad.length ? "warnbox" : "note";
    box.style.padding = bad.length ? "" : "10px 0 0";
  }
  /* Final is refused when the money does not add up — no "show it anyway".
     Kyle, 2026-09-13: "If the money doesnt match don't let me even show it on
     the tv!" Not yet always goes through. */
  function tapFinal(v){
    function go(){ setFinal(v); SETUP = localSetup(); renderEntry(); post(); }
    var c = Pts.purse(teamCount(), localSetup()), bad = Pts.moneyProblems(teamCount(), localSetup());
    if(v && bad.length){
      confirmSheet(c.diff !== 0 ? "The money doesn't add up" : "The money isn't right",
        bad.join(". ") + ". Fix the money first; nothing was sent.",
        [["Go back and fix it", null, true]]);
      return;
    }
    /* A blank score counts as nothing, so a forgotten card could move the
       money. This asks about MISSING scores only — it never looks at what a
       score is ("don't ever create any check that relies on points"). A
       cancelled match is zeros, which are scores. */
    var R = localSetup().rounds, missing = [];
    TEAMS.forEach(function(p, i){
      if(!(p[0] || p[1] || hasScores(i))) return;
      for(var k = 0; k < R; k++) if(points[i][k] === null){ missing.push({ i:i, k:k }); }
    });
    if(v && missing.length){
      var teams = {}, matches = {};
      missing.forEach(function(m){ teams[m.i] = 1; matches[m.k + 1] = 1; });
      var nt = Object.keys(teams).length, ms = Object.keys(matches);
      confirmSheet("Some scores are missing",
        nt + (nt === 1 ? " team has" : " teams have") + " no score for match" + (ms.length > 1 ? "es " : " ") + ms.join(", ") + ". A missing score counts as nothing.",
        [["Go back and fill them in", null, true], ["Final anyway", go]]);
      return;
    }
    go();
  }
  function hasScores(i){ return (points[i] || []).some(function(v){ return v !== null; }); }
  function removeTeam(i){
    function go(){ TEAMS.splice(i, 1); points.splice(i, 1); setTeams(TEAMS); save(); renderEntry(); }
    /* asks only when the team has scores */
    if(!hasScores(i)) return go();
    confirmSheet("Remove " + (Pts.teamName(TEAMS[i]) || "team " + (i+1)) + "?",
      "Their scores on this phone go too.",
      [["Remove", go, true], ["Cancel", null]]);
  }
  /* a team with no names and no scores is a row that was added and never used */
  function tidyTeams(){
    var keep = [], kept = [];
    TEAMS.forEach(function(p, i){ if(p[0] || p[1] || hasScores(i)){ keep.push(p); kept.push(points[i]); } });
    if(keep.length !== TEAMS.length){ TEAMS = keep; points = kept; setTeams(TEAMS); save(); }
  }

  /* THE SETUP TAB: the board, the shape of the event, and the money. */
  function setupTab(){
    var R = SETUP.rounds, N = SETUP.places, S2 = SETUP.second;
    var pad = h("div",{class:"pad"});
    function label(text){ return h("label",{text:text,style:"margin-top:12px"}); }

    pad.appendChild(h("div",{class:"setup"},[
      h("div",{class:"sect",text:"The board"}),
      h("label",{text:"Board title — the big line on the TV"}),
      /* saved without a redraw: see the Teams tab */
      h("input",{type:"text",value:getTitle(),
        onchange:function(){ setTitle(this.value); document.title = getTitle(); retitle(); }}),
      label("Event name — shows on the board"),
      h("input",{type:"text",value:getEvent(),placeholder:"e.g. 4-Day Member Guest",
        onchange:function(){ setEvent(this.value); retitle(); }}),
      label("TV key — type once, stays on this phone"),
      h("input",{type:"password",value:getKey(),placeholder:"the POST_KEY from the script",
        onchange:function(){ setKey(this.value); }})
    ]));

    /* Kyle, 2026-09-13: "for the 4 day there are 7 matches ... For the 3 day
       and the member member there are five matches. So we should have a
       toggle for 7 vs 5." */
    pad.appendChild(h("div",{class:"setup"},[
      h("div",{class:"sect",text:"This event"}),
      h("label",{text:"Matches"}),
      choiceButtons(Pts.ROUND_CHOICES, R, function(v){ setRounds(v); SETUP = localSetup(); renderEntry(); },
        function(v){ return v + " matches"; })
      /* No points settings — no scale, no highest, no lowest. Kyle,
         2026-09-13: "don't ever create any check that relies on points". */
    ]));

    /* The money. Kyle, 2026-09-13: "we should also decide if we are paying 1,
       2, or 3 places in the main pot", "most usually, I pay 1 total, 1
       Sunday", and "you should say first place money not pot money". */
    var money = [
      h("div",{class:"sect",text:"The money"}),
      h("label",{text:"Main pot pays"}),
      choiceButtons(Pts.PLACE_CHOICES, N, function(v){ setPlaces(v); SETUP = localSetup(); renderEntry(); },
        function(v){ return v === 1 ? "1 place" : v + " places"; })
    ];
    for(var p = 1; p <= N; p++)(function(p){
      money.push(label(Pts.placeName(p) + " place money — whole dollars"));
      money.push(h("input",{type:"number",inputmode:"numeric",min:"0",step:"1",
        value:(SETUP.prizes[p-1] ? String(SETUP.prizes[p-1]) : ""),placeholder:(p === 1 ? "e.g. 2000" : ""),
        oninput:function(){ setPrize(p, this.value); SETUP = localSetup(); showPurse(); }}));
    })(p);
    money.push(label("Second pot — always the last two matches (" + (R-1) + " and " + R + ")"));
    money.push(choiceButtons([true, false], S2.on, function(v){ var s = getSecond(); s.on = v; setSecond(s); SETUP = localSetup(); renderEntry(); },
      function(v){ return v ? "On" : "Off"; }));
    if(S2.on){
      money.push(label("Its name"));
      var amtLabel = label(S2.name + " — whole dollars");
      money.push(h("input",{type:"text",value:S2.name,
        onchange:function(){ var s = getSecond(); s.name = Pts.secondName(this.value); setSecond(s); SETUP = localSetup(); amtLabel.textContent = s.name + " — whole dollars"; }}));
      money.push(amtLabel);
      money.push(h("input",{type:"number",inputmode:"numeric",min:"0",step:"1",value:(S2.amount ? String(S2.amount) : ""),placeholder:"e.g. 500",
        oninput:function(){ var s = getSecond(); s.amount = Pts.money(this.value); setSecond(s); SETUP = localSetup(); showPurse(); }}));
    }
    /* This one sends as it is tapped. Kyle, 2026-09-13: "Seems redundant to
       have two buttons one for Final and One for Send to TV", then "Yes
       combine them". A stray tap is undone by tapping Not yet, which sends too. */
    /* the check: teams × $100 against the money typed, updated as it is typed */
    var purseBox = h("div",{id:"purse"});
    money.push(purseBox);
    showPurse(purseBox);
    money.push(label("TV board — show the money (sends to the TV as you tap)"));
    money.push(choiceButtons([false, true], getFinal(), function(v){ tapFinal(v); },
      function(v){ return v ? "Final — show it" : "Not yet"; }));
    pad.appendChild(h("div",{class:"setup"}, money));

    pad.appendChild(h("div",{class:"setup"},[
      h("div",{class:"sect",text:"TV board"}),
      h("label",{text:"TV board — teams on screen at once"}),
      choiceButtons(Pts.ROWS_CHOICES, getRows(), function(v){ setRows(v); renderEntry(); },
        function(v){ return v >= 100 ? "all" : String(v); }),
      label("TV board — seconds a page"),
      choiceButtons(Pts.SECS_CHOICES, getSecs(), function(v){ setSecs(v); renderEntry(); },
        function(v){ return String(v); }),
      h("div",{class:"note",style:"padding:8px 0 0",
        text:"Everything on this tab reaches the club screen the next time you Send to TV."})
    ]));

    /* Kyle, 2026-09-13: "It might be nice to memorialize the end of every
       tournament", and "what will be the protocol for starting a new
       tournament?" Share results is the record when no seat is there to close
       it out; a new tournament will not start without asking about it first. */
    pad.appendChild(h("div",{class:"setup"},[
      h("div",{class:"sect",text:"Tournament"}),
      h("button",{class:"bigbtn",text:"Share results",onclick:shareResults}),
      h("button",{class:"bigbtn quiet",text:"Start a new tournament",onclick:newTournament})
    ]));
    return pad;
  }

  function count(){ return Pts.entered(points, round0) + " of " + TEAMS.length + " in for match " + (round0+1); }
  function empty(){ return Pts.roundsIn(points) === 0; }

  /* a sheet from the bottom of the screen, a question and its answers */
  function confirmSheet(title, sub, buttons){
    var sheet = h("div",{class:"sheet",onclick:function(e){ if(e.target === sheet) close(); }});
    var inner = h("div",{class:"sheetin"},[
      h("div",{class:"sheetnm",text:title}),
      sub ? h("div",{class:"sheetsub",text:sub}) : null
    ]);
    buttons.forEach(function(b){
      inner.appendChild(h("button",{class:"bigbtn" + (b[2] ? " solid" : " quiet"),text:b[0],
        onclick:function(){ close(); if(b[1]) b[1](); }}));
    });
    sheet.appendChild(inner);
    function close(){ if(sheet.parentNode) sheet.parentNode.removeChild(sheet); }
    document.body.appendChild(sheet);
  }

  /* STARTING A NEW TOURNAMENT. The channel holds one event, and the first
     send of the next one overwrites it, so this asks about the record first. */
  function newTournament(){
    confirmSheet("Start a new tournament?",
      "This clears every score on this phone. Save the last one first: ask Claude to close it out, or tap Share results.",
      [["Share results first", shareResults],
       ["It's saved — keep these teams", function(){ startNew(false); }, true],
       ["It's saved — clear the teams too", function(){ startNew(true); }, true],
       ["Cancel", null]]);
  }
  function startNew(clearTeams){
    if(clearTeams){ TEAMS = []; setTeams(TEAMS); sendEmpty = true; }   /* the one time an empty send is meant */
    points = fitPoints([], TEAMS.length); save();
    setFinal(false); setPrizes([0,0,0]);
    var s = getSecond(); s.amount = 0; setSecond(s);
    setEvent("");
    SETUP = localSetup();
    round0 = 0; tab = clearTeams ? "teams" : "setup";
    postState = "New tournament — not sent to the TV yet";
    renderEntry();
  }

  /* SHARE RESULTS: the same Excel record a seat saves, built on the phone and
     handed to the share sheet (Mail, Messages, Save to Files). */
  function today(){ var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth()+1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function shareResults(){
    if(!window.Record){ flash("Share needs the new version: close and reopen the app"); return; }
    var round = roundToSend(), date = today(), bytes, name = window.Record.fileName(round, date);
    try{ bytes = window.Record.build(round, { date:date, note:"Shared from the phone" }); }
    catch(e){ flash("Could not make the file: " + e.message); return; }
    var type = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    /* a share that fails for any reason but a cancel falls back to saving the
       file, so the record is never simply lost */
    function download(){
      try{
        var url = URL.createObjectURL(new Blob([bytes], { type:type }));
        var a = h("a",{ href:url, download:name });
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 10000);
        flash("Saved " + name);
      }catch(e){ flash("Could not share: " + e.message); }
    }
    try{
      var file = new File([bytes], name, { type:type });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        navigator.share({ files:[file], title:name })
          .then(function(){ flash("Shared " + name); })
          .catch(function(e){ if(e && e.name === "AbortError") return; download(); });
        return;
      }
    }catch(e){}
    download();
  }

  /* Bring everything back down from the channel. Kyle, 2026-09-12: "downloaded
     it from safari and it wiped out all the scores" — an iPhone home-screen app
     gets its own storage. The channel is the copy that survives a phone. It
     only ever lands on an empty screen, so it cannot wipe work in hand. */
  /* a phone that has never saved a team list, a setting or a score. The Setup
     tab never writes the team list, so "no team list" alone let a phone pull
     the TV's copy over its freshly typed money on every open (Fable's review). */
  function freshPhone(){
    var touched = [TEAMSTORE, PRIZESTORE, SECONDSTORE, PLACESTORE, ROUNDSTORE, EVSTORE, TITLESTORE, FINALSTORE].some(function(k){ return read(k) !== null; });
    return !touched && empty();
  }
  function grab(){
    if(!MG_API){ flash("No TV address"); return; }
    flash("Getting…");
    fetch(MG_API + (MG_API.indexOf("?")>=0?"&":"?") + "board=vtp&t=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j && j.format === "vtp-live-v1" && Array.isArray(j.points) && Array.isArray(j.teams) && j.points.length === j.teams.length){
          if(!empty()){ flash("Not empty — nothing changed"); return; }
          /* a phone with its own teams or settings is asked first: the TV may
             still hold the tournament that was just finished */
          if(!freshPhone()){
            confirmSheet("Replace this phone's teams and settings?",
              "The TV has " + j.teams.length + " teams" + (j.event ? " for " + j.event : "") + ". If that is the tournament you just finished, tap Cancel.",
              [["Replace with the TV's", function(){ takeFromTV(j); }, true], ["Cancel", function(){ flash("Nothing changed"); }]]);
            return;
          }
          takeFromTV(j);
        } else {
          flash(j && j.empty ? "The TV has nothing yet" : "Nothing to get");
        }
      })
      .catch(function(e){ flash("Could not reach the TV: " + e.message); });
  }
  function takeFromTV(j){
          TEAMS = Pts.cleanTeams(j.teams); setTeams(TEAMS);
          points = fitPoints(j.points, TEAMS.length); save();
          var S = Pts.setup(j);
          setRounds(S.rounds); setPlaces(S.places); setPrizes(S.prizes); setSecond(S.second); setFinal(S.final);
          if(j.event) setEvent(j.event);
          if(j.title) setTitle(j.title);
          SETUP = localSetup();
          postState = "Got " + TEAMS.length + " teams and " + Pts.roundsIn(points, S.rounds) + " match(es) from the TV";
          renderEntry();
  }

  /* one row of choices, the current one filled in */
  function choiceButtons(choices, current, pick, label){
    var box = h("div",{class:"steps"});
    choices.forEach(function(v){
      box.appendChild(h("button",{class:(v === current ? "on" : ""), text:label(v),
        onclick:function(){ pick(v); }}));
    });
    return box;
  }

  /* ONE TAP. Kyle, 2026-09-13: "I really like the one tap. So how about
     numbers from 0 to 9 in half steps and a minus button?" Tap Minus first for
     a negative. The buttons are a shortcut, not a limit — "don't ever create
     any check that relies on points" — so Other opens the pad for any number
     they do not show. */
  function pick(i){
    var cur = points[i][round0];
    var neg = cur !== null && cur < 0;
    var holder = h("div");
    var minus = h("button",{class:"minus",text:"− Minus",onclick:function(){ neg = !neg; draw(); }});
    function draw(){
      holder.innerHTML = "";
      var g = h("div",{class:"tap"});
      for(var k = 0; k <= 18; k++)(function(v){
        var val = (neg && v) ? -v : v;
        g.appendChild(h("button",{class:(cur === val ? "on" : ""),text:show(val),
          onclick:function(){ setVal(i, val); close(); }}));
      })(k / 2);
      g.appendChild(h("button",{class:"other",text:"Other",onclick:function(){ close(); typePad(i, neg); }}));
      holder.appendChild(g);
      minus.className = "minus" + (neg ? " on" : "");
    }
    draw();
    var sheet = h("div",{class:"sheet",onclick:function(e){ if(e.target === sheet) close(); }},[
      h("div",{class:"sheetin"},[
        h("div",{class:"sheetnm",text:Pts.teamName(TEAMS[i]) || "Team " + (i+1)}),
        h("div",{class:"sheetsub",text:"Match " + (round0+1)}),
        minus,
        holder,
        h("div",{class:"sheetfoot"},[
          h("button",{text:"Clear",onclick:function(){ setVal(i,null); close(); }}),
          h("button",{text:"Cancel",onclick:close})
        ])
      ])
    ]);
    function close(){ if(sheet.parentNode) sheet.parentNode.removeChild(sheet); }
    document.body.appendChild(sheet);
  }

  /* THE PAD, behind Other: any number at all — positive, negative, whole,
     half or quarter — with a minus key (an iPhone number pad has none), shown
     large before it is saved. */
  function typePad(i, neg){
    var cur = points[i][round0];
    /* starts empty — or with a minus if Minus was on — never with the score
       already saved: the checkers found 5, then 1 2 −, saved as −512 */
    var typed = neg ? "-" : "";
    var disp = h("div",{class:"padshow"});
    /* blank until something is typed. Kyle, 2026-09-13: "I see a minus to the
       left of zero and a minus at the top above the 8 — confusing": the
       nothing-typed-yet dash looked like the minus key. A space keeps the
       line's height so the keys don't jump when the first digit lands. */
    function draw(){ disp.textContent = typed === "" ? " " : typed; }
    function key(k){
      if(k === "−") typed = typed.charAt(0) === "-" ? typed.slice(1) : "-" + typed;
      else if(k === "."){ if(typed.indexOf(".") < 0) typed += (typed === "" || typed === "-") ? "0." : "."; }
      else if(typed.replace("-", "").length < 7) typed += k;
      draw();
    }
    var grid = h("div",{class:"keys"});
    ["7","8","9","4","5","6","1","2","3","−","0","."].forEach(function(k){
      grid.appendChild(h("button",{text:k,onclick:function(){ key(k); }}));
    });
    draw();
    var sheet = h("div",{class:"sheet",onclick:function(e){ if(e.target === sheet) close(); }},[
      h("div",{class:"sheetin"},[
        h("div",{class:"sheetnm",text:Pts.teamName(TEAMS[i]) || "Team " + (i+1)}),
        h("div",{class:"sheetsub",text:"Match " + (round0+1) + (cur === null ? "" : " · now " + show(cur))}),
        disp,
        grid,
        h("div",{class:"sheetfoot"},[
          h("button",{text:"⌫",onclick:function(){ typed = typed.slice(0, -1); draw(); }}),
          h("button",{text:"Clear",onclick:function(){ setVal(i,null); close(); }}),
          h("button",{class:"save",text:"Save",onclick:function(){
            /* nothing typed is nothing to save: Clear is the button that empties a score */
            if(typed === "" || typed === "-"){ close(); return; }
            var v = Pts.score(typed);
            if(v === null){ disp.textContent = "Not a number"; return; }
            setVal(i, v); close();
          }})
        ])
      ])
    ]);
    function close(){ if(sheet.parentNode) sheet.parentNode.removeChild(sheet); }
    document.body.appendChild(sheet);
  }

  function setVal(i, v){
    points[i][round0] = Pts.score(v);
    save();
    var row = document.getElementById("row"+i), btn = document.getElementById("val"+i);
    if(row) row.className = "row" + (points[i][round0]===null?"":" done");
    if(btn){ btn.textContent = show(points[i][round0]); btn.className = "val" + (points[i][round0]===null?" empty":""); }
    var c = document.getElementById("count"); if(c) c.textContent = count();
  }

  /* ---------- settings on this phone ---------- */
  function read(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function write(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
  function readJSON(k){ try{ var v = read(k); return v === null ? null : JSON.parse(v); }catch(e){ return null; } }
  function getTeams(){ var t = readJSON(TEAMSTORE); return Array.isArray(t) ? Pts.cleanTeams(t) : Pts.cleanTeams(TEAMS_DEFAULT); }
  function setTeams(t){ write(TEAMSTORE, JSON.stringify(t)); }
  function getRounds(){ return Pts.rounds(read(ROUNDSTORE)); }
  function setRounds(v){ write(ROUNDSTORE, String(Pts.rounds(v))); }
  function getPlaces(){ return Pts.places(read(PLACESTORE)); }
  function setPlaces(v){ write(PLACESTORE, String(Pts.places(v))); }
  function getPrizes(){
    var p = readJSON(PRIZESTORE);
    if(!Array.isArray(p)) p = [read(POTSTORE)];       /* carried over from "First place money" */
    return [Pts.money(p[0]), Pts.money(p[1]), Pts.money(p[2])];
  }
  function setPrizes(p){ write(PRIZESTORE, JSON.stringify([Pts.money(p[0]), Pts.money(p[1]), Pts.money(p[2])])); }
  function setPrize(place, v){ var p = getPrizes(); p[place-1] = Pts.money(v); setPrizes(p); }
  function getSecond(){
    var s = readJSON(SECONDSTORE);
    if(!s || typeof s !== "object") s = { on:true, amount:read(SUNSTORE) };
    return { on:s.on !== false, name:Pts.secondName(s.name), amount:Pts.money(s.amount) };
  }
  function setSecond(s){ write(SECONDSTORE, JSON.stringify({ on:s.on !== false, name:Pts.secondName(s.name), amount:Pts.money(s.amount) })); }
  function localSetup(){ return { rounds:getRounds(), places:getPlaces(), prizes:getPrizes(), second:getSecond(), final:getFinal() }; }
  function getRows(){ return Pts.rows(read(ROWSTORE)); }
  function setRows(v){ write(ROWSTORE, String(Pts.rows(v))); }
  function getSecs(){ return Pts.secs(read(SECSTORE)); }
  function setSecs(v){ write(SECSTORE, String(Pts.secs(v))); }
  function getFinal(){ return read(FINALSTORE) === "1"; }
  function setFinal(v){ write(FINALSTORE, v ? "1" : "0"); }
  function getTitle(){ return read(TITLESTORE) || TITLE_DEFAULT; }
  function setTitle(v){ write(TITLESTORE, String(v).trim() || TITLE_DEFAULT); }
  /* a new tournament empties the event name, so empty is kept as empty */
  function getEvent(){ var v = read(EVSTORE); return v === null ? EVENT_DEFAULT : v; }
  function setEvent(v){ write(EVSTORE, String(v).trim()); }
  function getKey(){ return read(KEYSTORE) || ""; }
  function setKey(v){ write(KEYSTORE, v); }

  /* ---------- the channel ---------- */
  /* Everything the TV needs, in one send. No pot / sun fields: a board still
     running the old version would show that money with no $100 check, so it
     gets none — reload the club TV once after publishing. A team with no names
     and no scores is left out, without touching the phone's own list. */
  function roundToSend(){
    var S = localSetup(), t = [], p = [];
    TEAMS.forEach(function(pair, i){ if(pair[0] || pair[1] || hasScores(i)){ t.push(pair); p.push(points[i]); } });
    return {
      format:"vtp-live-v1", title:getTitle(), event:getEvent(), posted:new Date().toISOString(),
      rows:getRows(), secs:getSecs(),
      rounds:S.rounds, places:S.places, prizes:S.prizes, second:S.second, final:S.final,
      teams:t, points:p
    };
  }
  var sendEmpty = false, posting = false;
  function post(){
    if(!MG_API){ flash("No TV address set yet"); return; }
    if(!getKey()){ flash("Type the TV key first"); return; }
    var round = roundToSend();
    /* An emptied phone never sends: the channel is the only copy of the event,
       and one tap wiped a live 25-team board in Fable's review (2026-09-13).
       Clearing the teams on purpose (Start a new tournament) gets one send. */
    if(!round.teams.length && !sendEmpty){ flash("Nothing to send: no teams on this phone"); return; }
    if(posting){ flash("Still sending…"); return; }
    /* no tidying here: dropping a blank team while the Teams tab is on screen
       left its boxes pointing at the wrong team. roundToSend leaves blanks out. */
    posting = true; flash("Sending…");
    var ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timer = ctl ? setTimeout(function(){ ctl.abort(); }, 20000) : null;
    fetch(MG_API, {
      method:"POST", redirect:"follow", signal: ctl ? ctl.signal : undefined,
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ key:getKey(), board:"vtp", round:round })
    }).then(function(r){ return r.json(); })
      .then(function(j){ if(j && j.ok){ sendEmpty = false; flash("Sent to TV ✓ " + clock(Date.now())); } else flash("Not sent: " + ((j&&j.error)||"?")); })
      .catch(function(e){ flash("Not sent: " + (e && e.name === "AbortError" ? "no answer" : e.message)); })
      .then(function(){ posting = false; if(timer) clearTimeout(timer); });
  }
  function flash(m){ postState = m; var t = document.querySelector(".top .right"); if(t) t.lastChild.textContent = m; }

  function pull(){
    if(!MG_API) return;
    fetch(MG_API + (MG_API.indexOf("?")>=0?"&":"?") + "board=vtp&t=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(j){
        everFetched = true;
        if(j && j.format === "vtp-live-v1" && Array.isArray(j.points)){
          /* The teams, scores and set-up are the channel's. A payload from
             before the Teams tab has no usable teams list of its own length,
             and keeps the list this page starts with. */
          if(Array.isArray(j.teams) && j.teams.length === j.points.length) TEAMS = Pts.cleanTeams(j.teams);
          points = fitPoints(j.points, TEAMS.length);
          SETUP = Pts.setup(j);
          /* Shown, never saved. Kyle's phone can open this board too, and
             writing the TV's copy of the name into its storage put the old
             name back over the one he had just typed. */
          TV_NAMES = { title:j.title || "", event:j.event || "" };
          retitle();
          lastOK = Date.now();
          /* the phone decides how the board rotates; an address overrides it */
          var changed = false;
          if(!rowsLocked && j.rows && Pts.rows(j.rows) !== ROWS){ ROWS = Pts.rows(j.rows); changed = true; }
          if(!secsLocked && j.secs && Pts.secs(j.secs) !== SECS){ SECS = Pts.secs(j.secs); changed = true; }
          if(changed){ rowCap = 999; arm(); }
          /* only repaint when the scores actually changed, or every poll would
             restart the page turn and the board would never advance */
          /* a new team count means a new fit: the rows-a-page cap is measured again */
          if(TEAMS.length !== lastTeamCount){ lastTeamCount = TEAMS.length; rowCap = 999; }
          if(changed || j.posted !== lastPosted){ lastPosted = j.posted || ""; page = 0; renderBoard(); }
        } else if(j && j.empty && !lastPosted){ renderBoard(); }
      })
      .catch(function(){ everFetched = true; });
  }

  /* Re-armed whenever the phone changes the rotation. One timer turns the
     page and the banner together; with every team on one page there is no page
     to turn, but the banner still takes turns. */
  function arm(){
    if(pageTimer){ clearInterval(pageTimer); pageTimer = null; }
    pageTimer = setInterval(function(){ page++; turn++; renderBoard(); }, SECS * 1000);
  }

  /* ---------- keep the television awake ----------
     A page that looks idle gets put to sleep, so the board says it is in use,
     two ways, because Silk on a Fire TV is an old Chromium and may have
     neither:

       1. the Screen Wake Lock API, if it exists, re-taken whenever the tab
          comes back to the front (a lock is dropped when it is hidden). This
          needs nothing from Kyle.
       2. failing that, a 60 Hz tone at 0.0008 gain, far below hearing. A
          browser only lets it start after a remote press or pointer move on
          the page, and it then runs until the page closes. On 2026-09-12 the
          TV stayed on for hours and Kyle never touched the remote, so it was
          not this that did it. Kyle, 2026-09-13: "leave it for now".

     Neither is guaranteed on this hardware, and the TV's own energy saver is a
     separate setting on the TV. */
  function keepAwake(){
    var lock = null;
    function take(){
      try{
        if(navigator.wakeLock && navigator.wakeLock.request){
          navigator.wakeLock.request("screen").then(function(l){
            lock = l;
            l.addEventListener("release", function(){ lock = null; });
          }).catch(function(){});
        }
      }catch(e){}
    }
    take();
    document.addEventListener("visibilitychange", function(){
      if(!document.hidden && !lock) take();
    });

    var ctx = null;
    function tone(){
      if(ctx) { if(ctx.state === "suspended") ctx.resume(); return; }
      try{
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        ctx = new AC();
        var osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.frequency.value = 60;          /* low, and at this gain inaudible */
        gain.gain.value = 0.0008;
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start();
      }catch(e){ ctx = null; }
    }
    ["keydown","click","touchstart","mousemove"].forEach(function(ev){
      document.addEventListener(ev, tone, {once:false, passive:true});
    });
    document.addEventListener("visibilitychange", function(){ if(!document.hidden) tone(); });
  }

  /* ---------- go ---------- */
  if(ENTRY){
    renderEntry();
    /* Only a phone that has never held a tournament fills itself from the TV.
       The checkers found (2026-09-13) that "no scores" was the test, so after
       Start a new tournament, or teams from a link, one reopen pulled the
       finished event back — old teams, scores, money and Final. */
    if(MG_API && freshPhone() && !q.get("teams")) grab();
  }
  else{
    renderBoard();
    keepAwake();
    window.addEventListener("resize", function(){ rowCap = 999; renderBoard(); });
    arm();
    /* Measure again once the web font has actually arrived. Barlow Condensed
       loads after the first paint and the rows grow when it lands, which is
       what pushed the last teams off the bottom of the club TV on 2026-09-12.
       The timers cover a browser with no document.fonts. */
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ renderBoard(); });
    setTimeout(renderBoard, 600);
    setTimeout(renderBoard, 2500);
    if(MG_API){ pull(); setInterval(pull, EVERY); }
    setInterval(function(){ if(MG_API) renderBoard(); }, 60000);
  }
})();
</script>
</body>
</html>

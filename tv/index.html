<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E5A3C">
<title>Mengacci $$ — live board</title>
<link rel="icon" href="ccw-logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  /* The board on the club TV. Read from across a room: one type scale, no
     instructions, no money, nothing that scrolls. docs/DESIGN.md "The live board".
     The RULES live in ../scoring.js, which this page loads — the same file the
     phone runs, never a copy. Only the layout below is this page's own. */
  :root{
    --bg:#E9EFE8; --panel:#FBFCFA; --ink:#16241C; --muted:#5C6B61; --line:#CBD6CD;
    --green:#1E5A3C; --green-ink:#F4F8F4; --green-soft:#DCEADF;
    --gold:#A8781F; --gold-soft:#F5EBD3;
    --k:1;          /* the board shrinks to the screen it is on: see fit() */
    /* the header and the tie band shrink with it. They used to stay full size,
       so on a 960x540 window they pushed the bottom teams off the screen.
       At the approved size (k 0.78) this is 1 and nothing changes. */
    --hk:calc(var(--k) / 0.78);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--panel);color:var(--ink);
    font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.35;
    overflow:hidden}
  .screen{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

  .top{background:var(--green);color:var(--green-ink);padding:calc(18px * var(--hk)) 40px calc(14px * var(--hk));display:flex;align-items:flex-end;justify-content:space-between;gap:22px;flex:none}
  .tophead{display:flex;align-items:center;gap:calc(22px * var(--hk));min-width:0}
  .logo{width:calc(84px * var(--hk));height:calc(84px * var(--hk));flex:none;object-fit:contain;background:var(--green-ink);border-radius:50%;padding:5px}
  .eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:calc(20px * var(--hk));opacity:.85}
  .event{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:calc(26px * var(--hk));opacity:.9;margin-top:1px}
  .top h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:calc(40px * var(--hk));margin:2px 0 0;line-height:1}
  .top .right{font-family:"Barlow Condensed",sans-serif;font-size:calc(19px * var(--hk));font-weight:600;text-align:right;opacity:.9;white-space:nowrap}
  .top .right .warn{color:var(--gold-soft)}
  /* A frozen board must not look live from across the room: a solid gold
     block, the same size as the date, and the top line stops saying FINAL. */
  .top .right .stale{background:var(--gold);color:#1B1408;font-weight:700;font-size:calc(26px * var(--hk));padding:4px 14px;border-radius:999px;opacity:1}

  /* Said out loud, under the header, because a shaded row alone does not
     explain why one of two equal numbers took the money. */
  .cards{background:var(--gold-soft);color:var(--gold);flex:none;padding:calc(8px * var(--hk)) 40px;
    font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:calc(30px * var(--hk));
    display:flex;align-items:baseline;gap:16px;white-space:nowrap;overflow:hidden}
  .cards .lab{text-transform:uppercase;letter-spacing:.12em;font-size:calc(21px * var(--hk));opacity:.9}
  .cards .who{color:#7A560F}
  .cards .why{color:#8A6A2A;font-weight:600;font-size:calc(22px * var(--hk));opacity:.9;overflow:hidden;text-overflow:ellipsis}
  /* same height, nothing drawn: it exists only so the board is the same shape
     with a tie and without one */
  .cards.spacer{background:transparent;padding-top:calc(8px * var(--hk));padding-bottom:calc(8px * var(--hk))}
  .cards.spacer::before{content:" "}

  .scroll{flex:1;min-height:0;padding:18px 40px 24px;overflow:hidden}
  /* Equal halves. The tournament list rotates 13 at a time so it no longer
     needs the lion's share, and the skins side was cramped enough to clip a
     name. Kyle, 2026-09-12: "Maybe give more real estate to the skins side?" */
  /* The team side takes a little back: it carries the longest text on the
     board ("Guiditta & DeSaulniers"), while the skins side is one name and two
     small numbers. Kyle, 2026-09-12: "Maybe get a bit more real estate back on
     the team side in case we have long names there?" */
  .grid{display:grid;grid-template-columns:1.35fr 1fr;gap:0 44px;align-items:start}
  .col{display:flex;flex-direction:column;gap:12px;min-width:0}
  .col+.col{border-left:6px solid var(--green);padding-left:40px}
  .sect{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:calc(32px * var(--k));line-height:1.1;color:var(--ink);padding-top:6px}
  .secthead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .pill{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:18px;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .pill.pend{background:var(--gold-soft);color:var(--gold)}
  .pill.team{background:transparent;border:1px solid var(--line);color:var(--muted)}

  /* Widths are shares of the column they sit in and they add to 100, never
     fixed pixels. A pixel width wider than the screen leaves another column
     with nothing — on the points pot board that erased every team name, on a
     phone and on the club television alike (2026-09-12). */
  table{width:100%;table-layout:fixed;border-collapse:collapse;font-variant-numeric:tabular-nums}
  col.c-rank{width:8%} col.c-team{width:52%} col.c-par{width:22%} col.c-net{width:18%}
  /* The hole, the name and the score sat far apart because a short name left
     a wide gap before a right-aligned score. Narrower name column, and the
     score is centred in its own so it sits near the name rather than against
     the far edge. */
  col.c-hole{width:13%} col.c-who{width:55%} col.c-score{width:32%}
  /* Headers were half the size of what they head. Kyle, 2026-09-12: "Title
     TEAM TO PAR NET TOTAL a bit too small (same for Skins headers)". */
  th{font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:calc(27px * var(--k));color:var(--muted);text-align:left;padding:calc(8px * var(--k)) 6px;border-bottom:2px solid var(--line)}
  th.r{text-align:right}
  th.c{text-align:center}
  td{padding:calc(4px * var(--k)) 6px;border-bottom:1px solid var(--line);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.n{text-align:right;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:calc(26px * var(--k))}
  td.hn{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:calc(28px * var(--k));color:var(--muted)}
  td.team{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:calc(35px * var(--k))}
  td.topar{font-size:calc(40px * var(--k));color:var(--green);font-weight:700}
  /* Under par is the green; over par is plain ink. A +6 in the same green as a
     -18 reads as a good number at a glance, which is the one thing a board
     must not do. */
  td.topar.over{color:var(--ink)}
  /* A little air after the hole number — with none at all the name crowded it.
     Kyle, 2026-09-12. The header carries the same indent so they still line up. */
  td.who{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:calc(32px * var(--k));padding-left:calc(22px * var(--k))}
  th.who{padding-left:calc(22px * var(--k))}
  tr.lead td{background:var(--green-soft)}
  tr.lead td.topar,tr.lead td.hn{color:var(--green)}
  tr.blankrow td{border-bottom:0;background:transparent}
  tr.blankrow td.team::before,tr.blankrow td.who::before{content:" "}
  tr.skin td{background:var(--green-soft)}
  tr.skin td.who{color:var(--green)}
  tr.skin td.hn{font-size:calc(29px * var(--k));color:var(--ink)}
  tr.skin td.n{font-size:calc(32px * var(--k));text-align:center}

  /* the only screen that is not the board: nothing has arrived yet */
  .blank{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px}
  .blank .big{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:52px;line-height:1;color:var(--muted)}
  .blank .sub{font-size:22px;color:var(--muted);max-width:26em}

  /* a phone still shows the board, one column, for a phone check. Only a
     phone: it used to switch below 900px wide, so a television browser with
     a smaller window got a scrolling page nobody can scroll. fit() agrees. */
  @media (max-width:699px), (orientation:portrait){
    body{overflow:auto}
    .screen{height:auto;min-height:100vh}
    .top{padding:14px 16px 12px}
    .logo{width:52px;height:52px}
    .top h1{font-size:28px}
    .eyebrow{font-size:14px}
    .event{font-size:16px}
    .top .right,.top .right .stale{font-size:14px}
    .cards{font-size:18px;padding:6px 16px}
    .cards .lab{font-size:13px}
    .cards .why{font-size:14px}
    .scroll{padding:12px 16px 24px;overflow:visible}
    .grid{grid-template-columns:1fr;gap:18px}
    .col+.col{border-left:0;border-top:6px solid var(--green);padding-left:0;padding-top:14px}
    .sect{font-size:22px}
    td.team,td.who{font-size:20px}
    td.topar{font-size:24px}
  }
</style>
</head>
<body>
<div class="screen" id="screen"></div>
<script src="../scoring.js?v=5666b3c090"></script>
<script>
(function(){
  "use strict";
  var Sc = window.Scoring;

  /* Where the board reads from. Filled in when the Apps Script is deployed
     (sync/README.md). ?api=<url> overrides it for a test without a redeploy.
     The board does not care WHICH app posted — real or try. Whatever arrived
     last is what is on the TV. Kyle, 2026-09-10: "can't there be an option?" */
  var TV_API = "https://script.google.com/macros/s/AKfycbw756Fq3M4FB9zbR7FWhQiKMozAgSD2W6RjkImAC_4jg7x7l9ykjTzh4ZWUDZcNtbS_/exec";

  var EVERY = 20000;          /* poll, in ms */

  /* The tournament list rotates. Twenty-five teams on one screen forces the
     type down until nobody across the room can read it — Kyle, 2026-09-12:
     "All the fonts are very small now". Type size is bounded by row height and
     row height is the screen divided by the rows on it, so the only way to
     make it bigger is to show fewer at a time. ?rows= and ?secs= override. */
  var TROWS = 13, TSECS = 10;
  var TICK = 0, ttimer = null;  /* one clock turns the team pages and the skins pages */
  var STALE = 90000;          /* older than this and the top corner says so */

  var q = new URLSearchParams(location.search);
  if (q.get("api")) TV_API = q.get("api");
  /* An address wins, for a seat testing a size without touching Kyle's phone,
     and locks out whatever the phone sends. */
  var rowsLocked = /^\d+$/.test(q.get("rows") || ""), secsLocked = /^\d+$/.test(q.get("secs") || "");
  if (rowsLocked) TROWS = Math.max(4, Math.min(40, +q.get("rows")));
  if (secsLocked) TSECS = Math.max(3, Math.min(120, +q.get("secs")));

  /* Otherwise the phone decides, and a change takes effect on the next send. */
  function takeSettings(j){
    var changed = false;
    if (!rowsLocked && j && +j.rows >= 4 && +j.rows <= 40 && +j.rows !== TROWS){ TROWS = +j.rows; changed = true; }
    if (!secsLocked && j && +j.secs >= 3 && +j.secs <= 120 && +j.secs !== TSECS){ TSECS = +j.secs; changed = true; }
    if (changed && typeof armPages === "function") armPages();
    return changed;
  }

  var LIVE = null;            /* last good payload */
  var lastOK = 0;             /* when it arrived, ms */
  var everFetched = false;
  var lastErr = false;        /* the last poll failed: a first load says so rather than "No teams yet" */

  /* ---------- tiny DOM helper, same shape as the app's ---------- */
  function h(tag, attrs, kids){
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs){
      if (k === "text") e.textContent = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k === "class") e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function(c){ if (c) e.appendChild(c); });
    return e;
  }
  function clock(ms){ var d = new Date(ms), h = d.getHours(), m = d.getMinutes();
    return (h%12||12) + ":" + (m<10?"0":"") + m + (h<12 ? "am" : "pm"); }

  /* ---------- names: first name, plus a last initial only when two share it ---------- */
  var ROSTER = [];
  function buildRoster(L){
    ROSTER = [];
    var people = {};
    (L.people||[]).forEach(function(p){ people[p.id] = p; });
    (L.teams||[]).forEach(function(t){
      var out = (L.withdrawn||[]).indexOf(t.id) >= 0;
      (t.players||[]).forEach(function(id){
        var p = people[id]; if (!p) return;
        ROSTER.push({ id:id, first:p.first, last:p.last, name:(p.first+" "+p.last).trim(), out:out });
      });
    });
  }
  function player(id){ for (var i=0;i<ROSTER.length;i++) if (ROSTER[i].id===id) return ROSTER[i]; return null; }
  function first(id){
    var p = player(id); if (!p) return "?";
    var clash = ROSTER.some(function(o){ return o.id!==p.id && o.first===p.first; });
    return p.first + (clash && p.last ? " "+p.last.charAt(0)+"." : "");
  }

  /* ---------- the board ---------- */
  /* Shrink until the board fits the screen it is on. A row below the bottom
     edge is a team that is not on the board, and the board looks perfectly
     healthy doing it. SAFE keeps 3% clear because a television crops the edge
     of its picture. Everything here was learned on the points pot board on
     2026-09-12 with Kyle standing in front of the club TV. */
  function phoneLayout(){ return window.innerWidth < 700 || window.innerHeight > window.innerWidth; }
  /* Below this the type is too small to read across a room, so instead of
     shrinking further the board shows fewer rows a page (see paint()). */
  var KMIN = 0.5;
  function fit(box){
    var root = document.documentElement;
    root.style.setProperty("--k", "1");
    if (phoneLayout()) return { ok:true };        /* a phone scrolls, as it should */
    var SAFE = Math.max(18, Math.round(window.innerHeight * 0.03));
    var top = box.getBoundingClientRect().top;
    var target = window.innerHeight - SAFE;
    function lowest(){
      var b = 0;
      [].forEach.call(box.children, function(c){ b = Math.max(b, c.getBoundingClientRect().bottom); });
      return b;
    }
    /* Fill the screen, do not merely avoid overflowing it. The old loop only
       ever shrank, so a tall television left the type at whatever the base
       sizes happened to be while there was room going spare. Kyle, 2026-09-12:
       "So the fonts adjust size?" — they do, and now in both directions.
       The base sizes set the PROPORTIONS between the two halves; this decides
       how big the whole thing is on the screen in front of it. */
    /* A CEILING, not just a floor. Kyle approved the board at 0.78 and then
       watched it grow to 0.84 when a tie band disappeared and freed 50px:
       "Nope they got bigger again!!" Type that moves with the content is type
       nobody can settle on, so this is the largest it is ever allowed to be.
       The lever for bigger is fewer teams a page, which is Kyle's setting. */
    var MAXK = 0.78;
    var lo = KMIN, hi = MAXK, k = 1, guard = 0;
    function fits(v){
      root.style.setProperty("--k", String(v));
      return lowest() <= target;
    }
    /* If it does not fit even at the smallest readable size, say which side
       is too long, so paint() can put fewer rows on a page. A row below the
       bottom edge is a team, or a skin winner, silently missing. */
    if (!fits(lo)) {
      var cols = box.children;
      return { ok:false,
               teamsOver: !!cols[0] && cols[0].getBoundingClientRect().bottom > target,
               skinsOver: !!cols[1] && cols[1].getBoundingClientRect().bottom > target };
    }
    while (hi - lo > 0.01 && guard++ < 24){
      var mid = (lo + hi) / 2;
      if (fits(mid)) lo = mid; else hi = mid;
    }
    k = lo;
    root.style.setProperty("--k", String(k));
    return { ok:true, k:k };
  }

  /* A drawing error must never leave the club TV white. It did: a new page
     beside an old rules file, or one bad card in the feed, and the screen went
     blank. Now the last board that drew goes back up; the next poll tries again. */
  function render(){
    var s = document.getElementById("screen");
    var old = [].slice.call(s.childNodes || s.children || []);
    try { paint(s); }
    catch (e) {
      try { console.error(e); } catch (x) {}
      s.textContent = "";
      old.forEach(function(n){ s.appendChild(n); });
    }
  }

  /* how many team rows and skins rows a page holds on THIS screen; worked out
     again only when something that changes it changes */
  var layout = { key:"", t:0, s:0 };

  function paint(s){
    if (!LIVE || LIVE.empty || !(LIVE.teams||[]).length){
      s.textContent = "";
      s.appendChild(head("Mengacci $$ · CCW", "Live board"));
      s.appendChild(h("div",{class:"blank"},[
        h("div",{class:"big",text: !TV_API ? "Board not connected" : everFetched ? "No teams yet" : lastErr ? "Can't reach the scores" : "Waiting for the first scores"}),
        h("div",{class:"sub",text: !TV_API ? "This page has no address to read from." : (!everFetched && lastErr) ? "Trying again every 20 seconds." : ""})
      ]));
      return;
    }

    buildRoster(LIVE);
    /* only a real card counts: one entry with no scores must not take the board down */
    var by = {};
    Object.keys(LIVE.by || {}).forEach(function(k){
      var e = LIVE.by[k];
      if (e && Array.isArray(e.scores) && e.scores.length === 18) by[k] = e;
    });
    var ids = Object.keys(by);
    var pend = LIVE.pending || 0;
    var st = Sc.standings(LIVE.teams, by, LIVE.withdrawn || []);
    var teamsTotal = LIVE.teams.length - st.withdrawn.length, teamsIn = st.done.length;
    var status = Sc.boardStatus(teamsTotal, teamsIn, pend);
    var eyebrow = status === "none" ? "No teams yet"
                : status === "final" ? "FINAL · all " + teamsTotal + " teams reported"
                : "TENTATIVE · " + teamsIn + " of " + teamsTotal + " teams reported";

    /* Only the winner is shaded. Kyle, 2026-09-12: "We should only shade the
       winner. But somewhere prominent we need to say Won by USGA rules Match
       of Cards." A tie on the total is settled by the match of cards and the
       money goes to one team, so the green marks that team and the band below
       the header says how it was decided. */
    var best = st.done.length ? st.done[0].total : null;
    var tiedAtTop = st.done.filter(function(x){ return x.total === best; });

    /* If the match of cards cannot separate them, the board must not pick one.
       Kyle, 2026-09-12: "If you have inseparable from match of cards you are
       greenlighting a winner and that's not good." So when nothing separates
       the leaders, they all carry rank 1 and they are all shaded; the green
       says "one of these", not "this one". The next team down is still 3,
       because two of them are ahead of it. */
    var inseparable = tiedAtTop.filter(function(x){
      return Sc.matchOfCards(st.done[0].bb, x.bb).d === 0;
    });
    var undecided = inseparable.length > 1;

    /* Identical cards share a rank wherever they are on the list, not only at
       the top; the next team down counts everyone above it. */
    var rk = [];
    st.done.forEach(function(x, i){ rk.push(i > 0 && Sc.matchOfCards(st.done[i-1].bb, x.bb).d === 0 ? rk[i-1] : i + 1); });
    var rows = st.done.map(function(x, i){
      return { kind:"done", i:i, x:x,
               lead: undecided ? (i < inseparable.length) : (i === 0),
               rank: rk[i] };
    }).concat(st.waiting.map(function(t){ return { kind:"waiting", t:t }; }));

    /* right: the skins, one list per pot */
    var players = ids.map(function(pid){ return by[pid]; });
    var pots = Sc.pots(players, LIVE.cutoff == null ? null : LIVE.cutoff);
    var skinLists = (LIVE.cutoff == null
      ? [{ m:pots.net, g:false, label:"Net skins" }]
      : [{ m:pots.gross, g:true, label:"Gross skins · hcp " + LIVE.cutoff + " and under" },
         { m:pots.net, g:false, label:"Net skins · hcp over " + LIVE.cutoff }]
    ).map(function(p){ p.list = Sc.skins(p.m, p.g).filter(function(r){ return r.kind === "skin"; }); return p; });
    var maxSkins = Math.max.apply(null, skinLists.map(function(p){ return p.list.length; }));

    var total = Sc.PAR_TOTAL;
    function draw(rowsT, rowsS){
      s.textContent = "";
      /* left: the tournament, one page at a time */
      var group = h("colgroup",{},[
        h("col",{class:"c-rank"}), h("col",{class:"c-team"}),
        h("col",{class:"c-par"}), h("col",{class:"c-net"})
      ]);
      var tt = h("table",{},[group, h("tr",{},[h("th",{text:""}),h("th",{text:"Team"}),h("th",{text:"To par",class:"r"}),h("th",{text:"Net total",class:"r"})])]);
      var pages = Math.max(1, Math.ceil(rows.length / rowsT));
      var tpage = TICK % pages;
      var part = rows.slice(tpage * rowsT, tpage * rowsT + rowsT);
      while (part.length < rowsT && pages > 1) part.push(null);

      part.forEach(function(r){
        if (!r){
          tt.appendChild(h("tr",{class:"blankrow"},[
            h("td",{class:"hn"}), h("td",{class:"team"}), h("td",{class:"n topar"}), h("td",{class:"n"})
          ]));
          return;
        }
        if (r.kind === "waiting"){
          tt.appendChild(h("tr",{},[
            h("td",{class:"hn",text:""}),
            h("td",{class:"team muted",text:r.t.players.map(first).join(" & ")}),
            h("td",{colspan:"2"},[h("span",{class:"pill team",text:"Scores not in yet"})])
          ]));
          return;
        }
        tt.appendChild(h("tr",{class:(r.lead ? "lead" : "")},[
          h("td",{class:"hn",text:String(r.rank)}),
          h("td",{class:"team",text:r.x.team.players.map(first).join(" & ")}),
          h("td",{class:"n topar" + (r.x.total > total ? " over" : ""),
            text:Sc.toPar(r.x.total)}),
          h("td",{class:"n muted",text:String(r.x.total)})
        ]));
      });

      function potBlock(p){
        /* The skins table needs its own column definitions too. Without them,
           table-layout:fixed simply splits the table into equal thirds, which is
           what put the hole, the name and the score so far apart. */
        var sg = h("colgroup",{},[
          h("col",{class:"c-hole"}), h("col",{class:"c-who"}), h("col",{class:"c-score"})
        ]);
        var t = h("table",{},[sg, h("tr",{},[h("th",{text:"Hole"}),h("th",{text:"Skin",class:"who"}),h("th",{text:p.g?"Gross score":"Net score",class:"c"})])]);
        /* A long skins list turns pages too, on the same clock as the teams,
           rather than running off the bottom of the screen. */
        var per = rowsS || p.list.length || 1;
        var spages = Math.max(1, Math.ceil(p.list.length / per)), sp = TICK % spages;
        var shown = p.list.slice(sp * per, sp * per + per);
        shown.forEach(function(r){
          t.appendChild(h("tr",{class:"skin"},[
            h("td",{class:"hn",text:String(r.hole)}),
            h("td",{class:"who",text: player(r.holder) ? player(r.holder).name : "?"}),
            h("td",{class:"n",text:String(r.score)})
          ]));
        });
        for (var b = shown.length; spages > 1 && b < per; b++)
          t.appendChild(h("tr",{class:"blankrow"},[h("td",{class:"hn"}), h("td",{class:"who"}), h("td",{class:"n"})]));
        if (!p.list.length) t.appendChild(h("tr",{},[h("td",{colspan:"3",class:"muted",text:"No skins yet"})]));
        var hd = h("div",{class:"sect secthead"},[h("span",{text:p.label})]);
        if (spages > 1) hd.appendChild(h("span",{class:"pill team",text:(sp+1) + " of " + spages}));
        if (status !== "final" && teamsTotal) hd.appendChild(h("span",{class:"pill pend",text:"Not all scores in yet"}));
        return [hd, t];
      }
      var blocks = [];
      skinLists.forEach(function(p){ blocks = blocks.concat(potBlock(p)); });

      s.appendChild(head(eyebrow, (LIVE.event && LIVE.event.name) || "Mengacci $$"));
      band();
      var grid = h("div",{class:"grid"},[
        h("div",{class:"col"},[
          h("div",{class:"sect secthead"},[
            h("span",{text:"Tournament · 2-man best ball net"}),
            pages > 1 ? h("span",{class:"pill team",text:(tpage+1) + " of " + pages}) : null
          ]),
          tt]),
        h("div",{class:"col"}, blocks)
      ]);
      s.appendChild(h("div",{class:"scroll"},[grid]));
      return grid;
    }

    /* Fit this screen. Start from what worked last time; if the board does not
       fit at the smallest readable type, take a row off whichever side is too
       long and try again. */
    var key = [window.innerWidth, window.innerHeight, TROWS, rows.length,
               skinLists.map(function(p){ return p.list.length; }).join(","),
               tiedAtTop.length > 1, document.fonts ? document.fonts.status : ""].join("|");
    if (layout.key !== key) layout = { key:key, t:TROWS, s:0 };
    for (var tries = 0; tries < 80; tries++){
      var res = fit(draw(layout.t, layout.s));
      if (res.ok) break;
      var changed = false;
      if (res.skinsOver){ var cur = layout.s || maxSkins; if (cur > 1){ layout.s = cur - 1; changed = true; } }
      if (res.teamsOver && layout.t > 3){ layout.t--; changed = true; }
      if (!changed) break;
    }

    function band(){
    /* The band's height is reserved whether or not there is a tie, so the
       board does not resize itself the moment one appears. */
    if (tiedAtTop.length <= 1){
      s.appendChild(h("div",{class:"cards spacer"}));
    }
    if (tiedAtTop.length > 1){
      /* Say exactly how it was decided, not just that it was. Kyle,
         2026-09-12: "How about explaining even more how the match of cards was
         ultimately decided in the banner?" scoring.js already records which
         comparison broke it and both numbers; this puts them on the wall so
         nobody has to take it on trust. */
      var mine = st.done[0], other = tiedAtTop[1];
      var m = Sc.matchOfCards(mine.bb, other.bb);
      var WORD = { "back 9":"the back nine", "last 6":"the last six",
                   "last 3":"the last three", "18th":"the 18th" };
      var nameOf = function(x){ return x.team.players.map(first).join(" & "); };
      var who, why;
      if (undecided) {
        /* Nobody is named as the winner, because nobody is. All of them are
           named together and the board says the rules ran out. */
        who = inseparable.map(nameOf).join("  and  ");
        why = "level on " + best + " · cards identical through 18 · "
            + "the match of cards cannot separate them";
      } else if (m.how && WORD[m.how]) {
        who = nameOf(mine);
        /* "won" only once it is final: while teams are still out, one of them
           could beat both, so until then the leader is only ahead */
        why = "level on " + best + " with " + nameOf(other)
            + " · " + (status === "final" ? "won on " : "ahead on ") + WORD[m.how] + ", " + m.av + " to " + m.bv
            + " · USGA match of cards";
      } else {
        who = nameOf(mine);
        why = "level on " + best + " with " + nameOf(other);
      }
      s.appendChild(h("div",{class:"cards"},[
        h("span",{class:"lab",text: undecided ? "Still tied" : "Match of cards"}),
        h("span",{class:"who",text: who}),
        h("span",{class:"why",text: why})
      ]));
    }
    }
  }

  /* Top right: when the PHONE last sent, not when this page last asked. If our
     own polling has gone quiet for a minute and a half, say so in gold rather
     than let a frozen board look live. */
  /* The date, spelled out, and NOT typed by anyone. Kyle, 2026-09-12: "The
     date should be automatic. Not by me." So it is the day the phone actually
     sent these scores — which is the day they were played, needs no setting up,
     and cannot be left wrong from last time. A board still running the next
     morning shows yesterday, correctly, because that is when the round was.
     The Setup date is only a fallback for a feed that carries no timestamp. */
  function eventDate(){
    var stamp = LIVE && (LIVE.received || LIVE.posted);
    if (stamp) {
      var t = new Date(stamp);
      if (!isNaN(t)) return spell(t);
    }
    var raw = LIVE && LIVE.event && LIVE.event.date;
    if (!raw) return "";
    var d = new Date(String(raw) + (String(raw).length === 10 ? "T12:00:00" : ""));
    if (isNaN(d)) return String(raw);
    return spell(d);
  }

  function spell(d){
    var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    var mons = ["January","February","March","April","May","June","July",
                "August","September","October","November","December"];
    return days[d.getDay()] + ", " + mons[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  }

  function head(eyebrow, title){
    var age = lastOK ? Date.now() - lastOK : 0;
    var sent = LIVE && (LIVE.received || LIVE.posted) ? clock(Date.parse(LIVE.received || LIVE.posted)) : null;
    var stale = lastOK && age > STALE;
    if (stale) eyebrow = "Not updating";      /* never FINAL over a board that has stopped */
    var right = !lastOK ? h("div",{class:"right"},[h("span",{class:"warn",text:"connecting"})])
      : stale ? h("div",{class:"right"},[h("span",{class:"stale",text:"not updating · scores as of "+(sent||clock(lastOK))})])
      : h("div",{class:"right",text: sent ? "scores as of "+sent : "updated "+clock(lastOK)});
    return h("div",{class:"top"},[
      h("div",{class:"tophead"},[
        /* no click: h() cannot attach one (it threw), and a TV sent to the
           app would fall under the app's offline copy */
        h("img",{class:"logo",src:"ccw-logo.png",alt:"Country Club of Waterbury"}),
        h("div",{},[
          h("div",{class:"eyebrow",text:eyebrow}),
          h("h1",{text:title}),
          h("div",{class:"event",text:eventDate()})
        ])
      ]),
      right
    ]);
  }

  /* ---------- the poll: never blank the board on a failure ---------- */
  function poll(){
    if (!TV_API){ render(); return; }
    var url = TV_API + (TV_API.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now();
    fetch(url, { method:"GET", cache:"no-store" })
      .then(function(r){ if (!r.ok) throw new Error("channel " + r.status); return r.json(); })
      .then(function(data){
        everFetched = true; lastErr = false;
        if (data && data.format === "mengacci-live-v1"){ LIVE = data; lastOK = Date.now(); takeSettings(data); }
        render();
      })
      .catch(function(){ lastErr = true; render(); });   /* keep the last good board up */
  }

  render();
  poll();
  setInterval(poll, EVERY);
  /* turn the page */
  function armPages(){
    if (ttimer) clearInterval(ttimer);
    ttimer = setInterval(function(){ TICK++; render(); }, TSECS * 1000);
  }
  armPages();
  /* Measure again once the web font has arrived: Barlow Condensed lands after
     the first paint and every row grows when it does, so the first measurement
     is of a page that no longer exists. This, not the obvious suspects, is what
     cut rows off the club TV. The timers cover a browser without document.fonts,
     and resize covers a television that changes mode. */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ render(); });
  setTimeout(render, 600);
  setTimeout(render, 2500);
  window.addEventListener("resize", function(){ render(); });

  /* ---------- keep the television awake ----------
     Copied from the points pot board (mg/index.html), where it kept the club
     TV on for hours on 2026-09-12. Kyle, 2026-09-13: "the board stayed alive
     for hours and hours yesterday so it worked. Copy it into Mengacci!"

     A page that looks idle gets put to sleep, so the board says it is in use,
     two ways, because Silk on a Fire TV is an old Chromium and may have
     neither:

       1. the Screen Wake Lock API, if it exists, re-taken whenever the tab
          comes back to the front (a lock is dropped when it is hidden);
       2. failing that, a tone far below hearing. A device with audio playing
          is a device in use. It needs a user gesture to start, which the
          first remote press supplies, so it arms itself on the first key or
          click and not before.

     Neither is guaranteed on this hardware. It is a nudge, not a promise, and
     the TV's own energy saver is a separate setting on the TV. */
  function keepAwake(){
    var lock = null;
    function take(){
      try{
        if(navigator.wakeLock && navigator.wakeLock.request){
          navigator.wakeLock.request("screen").then(function(l){
            lock = l;
            l.addEventListener("release", function(){ lock = null; });
          }).catch(function(){});
        }
      }catch(e){}
    }
    take();
    document.addEventListener("visibilitychange", function(){
      if(!document.hidden && !lock) take();
    });

    var ctx = null;
    function tone(){
      if(ctx) { if(ctx.state === "suspended") ctx.resume(); return; }
      try{
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        ctx = new AC();
        var osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.frequency.value = 60;          /* low, and at this gain inaudible */
        gain.gain.value = 0.0008;
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start();
      }catch(e){ ctx = null; }
    }
    ["keydown","click","touchstart","mousemove"].forEach(function(ev){
      document.addEventListener(ev, tone, {once:false, passive:true});
    });
    document.addEventListener("visibilitychange", function(){ if(!document.hidden) tone(); });
  }
  keepAwake();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E5A3C">
<title>Mengacci $$ — live board</title>
<link rel="icon" href="ccw-logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  /* The board on the club TV. Read from across a room: one type scale, no
     instructions, no money, nothing that scrolls. docs/DESIGN.md "The live board".
     The RULES live in ../scoring.js, which this page loads — the same file the
     phone runs, never a copy. Only the layout below is this page's own. */
  :root{
    --bg:#E9EFE8; --panel:#FBFCFA; --ink:#16241C; --muted:#5C6B61; --line:#CBD6CD;
    --green:#1E5A3C; --green-ink:#F4F8F4; --green-soft:#DCEADF;
    --gold:#A8781F; --gold-soft:#F5EBD3;
    --k:1;          /* the board shrinks to the screen it is on: see fit() */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--panel);color:var(--ink);
    font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.35;
    overflow:hidden}
  .screen{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

  .top{background:var(--green);color:var(--green-ink);padding:18px 40px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:22px;flex:none}
  .tophead{display:flex;align-items:center;gap:22px;min-width:0}
  .logo{width:84px;height:84px;flex:none;object-fit:contain;background:var(--green-ink);border-radius:50%;padding:5px}
  .eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:20px;opacity:.85}
  .event{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:26px;opacity:.9;margin-top:1px}
  .top h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:40px;margin:2px 0 0;line-height:1}
  .top .right{font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600;text-align:right;opacity:.9;white-space:nowrap}
  .top .right .warn{color:var(--gold-soft)}

  /* Said out loud, under the header, because a shaded row alone does not
     explain why one of two equal numbers took the money. */
  .cards{background:var(--gold-soft);color:var(--gold);flex:none;padding:8px 40px;
    font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;
    display:flex;align-items:baseline;gap:16px;white-space:nowrap;overflow:hidden}
  .cards .lab{text-transform:uppercase;letter-spacing:.12em;font-size:21px;opacity:.9}
  .cards .who{color:#7A560F}
  .cards .why{color:#8A6A2A;font-weight:600;font-size:22px;opacity:.9;overflow:hidden;text-overflow:ellipsis}

  .scroll{flex:1;min-height:0;padding:18px 40px 24px;overflow:hidden}
  /* Equal halves. The tournament list rotates 13 at a time so it no longer
     needs the lion's share, and the skins side was cramped enough to clip a
     name. Kyle, 2026-09-12: "Maybe give more real estate to the skins side?" */
  /* The team side takes a little back: it carries the longest text on the
     board ("Guiditta & DeSaulniers"), while the skins side is one name and two
     small numbers. Kyle, 2026-09-12: "Maybe get a bit more real estate back on
     the team side in case we have long names there?" */
  .grid{display:grid;grid-template-columns:1.35fr 1fr;gap:0 44px;align-items:start}
  .col{display:flex;flex-direction:column;gap:12px;min-width:0}
  .col+.col{border-left:6px solid var(--green);padding-left:40px}
  .sect{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:calc(32px * var(--k));line-height:1.1;color:var(--ink);padding-top:6px}
  .secthead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .pill{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:18px;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .pill.pend{background:var(--gold-soft);color:var(--gold)}
  .pill.team{background:transparent;border:1px solid var(--line);color:var(--muted)}

  /* Widths are shares of the column they sit in and they add to 100, never
     fixed pixels. A pixel width wider than the screen leaves another column
     with nothing — on the points pot board that erased every team name, on a
     phone and on the club television alike (2026-09-12). */
  table{width:100%;table-layout:fixed;border-collapse:collapse;font-variant-numeric:tabular-nums}
  col.c-rank{width:8%} col.c-team{width:52%} col.c-par{width:22%} col.c-net{width:18%}
  /* The hole, the name and the score sat far apart because a short name left
     a wide gap before a right-aligned score. Narrower name column, and the
     score is centred in its own so it sits near the name rather than against
     the far edge. */
  col.c-hole{width:13%} col.c-who{width:55%} col.c-score{width:32%}
  th{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:calc(20px * var(--k));color:var(--muted);text-align:left;padding:calc(8px * var(--k)) 6px;border-bottom:1px solid var(--line)}
  th.r{text-align:right}
  td{padding:calc(4px * var(--k)) 6px;border-bottom:1px solid var(--line);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.n{text-align:right;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:calc(30px * var(--k))}
  td.hn{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:calc(28px * var(--k));color:var(--muted)}
  td.team{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:calc(40px * var(--k))}
  td.topar{font-size:calc(46px * var(--k));color:var(--green);font-weight:700}
  td.who{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:calc(34px * var(--k));padding-left:calc(16px * var(--k))}
  tr.lead td{background:var(--green-soft)}
  tr.lead td.topar,tr.lead td.hn{color:var(--green)}
  tr.blankrow td{border-bottom:0;background:transparent;padding:0}
  tr.skin td{background:var(--green-soft)}
  tr.skin td.who{color:var(--green)}
  tr.skin td.hn{font-size:calc(32px * var(--k));color:var(--ink)}
  tr.skin td.n{font-size:calc(34px * var(--k));text-align:center}

  /* the only screen that is not the board: nothing has arrived yet */
  .blank{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px}
  .blank .big{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:52px;line-height:1;color:var(--muted)}
  .blank .sub{font-size:22px;color:var(--muted);max-width:26em}

  /* a small screen still shows the board, one column, for a phone check */
  @media (max-width:899px){
    body{overflow:auto}
    .screen{height:auto;min-height:100vh}
    .top{padding:14px 16px 12px}
    .logo{width:52px;height:52px}
    .top h1{font-size:28px}
    .eyebrow{font-size:14px}
    .top .right{font-size:14px}
    .scroll{padding:12px 16px 24px;overflow:visible}
    .grid{grid-template-columns:1fr;gap:18px}
    .col+.col{border-left:0;border-top:6px solid var(--green);padding-left:0;padding-top:14px}
    .sect{font-size:22px}
    td.team,td.who{font-size:20px}
    td.topar{font-size:24px}
  }
</style>
</head>
<body>
<div class="screen" id="screen"></div>
<script src="../scoring.js"></script>
<script>
(function(){
  "use strict";
  var Sc = window.Scoring;

  /* Where the board reads from. Filled in when the Apps Script is deployed
     (sync/README.md). ?api=<url> overrides it for a test without a redeploy.
     The board does not care WHICH app posted — real or try. Whatever arrived
     last is what is on the TV. Kyle, 2026-09-10: "can't there be an option?" */
  var TV_API = "https://script.google.com/macros/s/AKfycbw756Fq3M4FB9zbR7FWhQiKMozAgSD2W6RjkImAC_4jg7x7l9ykjTzh4ZWUDZcNtbS_/exec";

  var EVERY = 20000;          /* poll, in ms */

  /* The tournament list rotates. Twenty-five teams on one screen forces the
     type down until nobody across the room can read it — Kyle, 2026-09-12:
     "All the fonts are very small now". Type size is bounded by row height and
     row height is the screen divided by the rows on it, so the only way to
     make it bigger is to show fewer at a time. ?rows= and ?secs= override. */
  var TROWS = 13, TSECS = 10;
  var tpage = 0, ttimer = null;
  var STALE = 90000;          /* older than this and the top corner says so */

  var q = new URLSearchParams(location.search);
  if (q.get("api")) TV_API = q.get("api");
  if (/^\d+$/.test(q.get("rows") || "")) TROWS = Math.max(4, Math.min(40, +q.get("rows")));
  if (/^\d+$/.test(q.get("secs") || "")) TSECS = Math.max(3, Math.min(120, +q.get("secs")));

  var LIVE = null;            /* last good payload */
  var lastOK = 0;             /* when it arrived, ms */
  var everFetched = false;

  /* ---------- tiny DOM helper, same shape as the app's ---------- */
  function h(tag, attrs, kids){
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs){
      if (k === "text") e.textContent = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k === "class") e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function(c){ if (c) e.appendChild(c); });
    return e;
  }
  function clock(ms){ var d = new Date(ms), hh = d.getHours()%12||12, m = d.getMinutes(); return hh+":"+(m<10?"0":"")+m; }

  /* ---------- names: first name, plus a last initial only when two share it ---------- */
  var ROSTER = [];
  function buildRoster(L){
    ROSTER = [];
    var people = {};
    (L.people||[]).forEach(function(p){ people[p.id] = p; });
    (L.teams||[]).forEach(function(t){
      var out = (L.withdrawn||[]).indexOf(t.id) >= 0;
      (t.players||[]).forEach(function(id){
        var p = people[id]; if (!p) return;
        ROSTER.push({ id:id, first:p.first, last:p.last, name:(p.first+" "+p.last).trim(), out:out });
      });
    });
  }
  function player(id){ for (var i=0;i<ROSTER.length;i++) if (ROSTER[i].id===id) return ROSTER[i]; return null; }
  function first(id){
    var p = player(id); if (!p) return "?";
    var clash = ROSTER.some(function(o){ return o.id!==p.id && o.first===p.first; });
    return p.first + (clash && p.last ? " "+p.last.charAt(0)+"." : "");
  }

  /* ---------- the board ---------- */
  /* Shrink until the board fits the screen it is on. A row below the bottom
     edge is a team that is not on the board, and the board looks perfectly
     healthy doing it. SAFE keeps 3% clear because a television crops the edge
     of its picture. Everything here was learned on the points pot board on
     2026-09-12 with Kyle standing in front of the club TV. */
  function fit(box){
    var root = document.documentElement;
    root.style.setProperty("--k", "1");
    if (window.innerWidth < 900) return;          /* a phone scrolls, as it should */
    var SAFE = Math.max(18, Math.round(window.innerHeight * 0.03));
    var top = box.getBoundingClientRect().top;
    var target = window.innerHeight - SAFE;
    function lowest(){
      var b = 0;
      [].forEach.call(box.children, function(c){ b = Math.max(b, c.getBoundingClientRect().bottom); });
      return b;
    }
    var k = 1, guard = 0;
    while (lowest() > target && k > 0.4 && guard++ < 16){
      k = Math.max(0.4, k * Math.min(0.985, (target - top) / (lowest() - top)));
      root.style.setProperty("--k", String(k));
    }
  }

  function render(){
    var s = document.getElementById("screen");
    s.textContent = "";

    if (!LIVE || LIVE.empty || !(LIVE.teams||[]).length){
      s.appendChild(head("Mengacci $$ · CCW", "Live board"));
      s.appendChild(h("div",{class:"blank"},[
        h("div",{class:"big",text: !TV_API ? "Board not connected" : everFetched ? "No teams yet" : "Waiting for the first scores"}),
        h("div",{class:"sub",text: !TV_API ? "This page has no address to read from." : ""})
      ]));
      return;
    }

    buildRoster(LIVE);
    var by = LIVE.by || {};
    var ids = Object.keys(by);
    var pend = LIVE.pending || 0;
    var st = Sc.standings(LIVE.teams, by, LIVE.withdrawn || []);
    var teamsTotal = LIVE.teams.length - st.withdrawn.length, teamsIn = st.done.length;
    var status = Sc.boardStatus(teamsTotal, teamsIn, pend);
    var eyebrow = status === "none" ? "No teams yet"
                : status === "final" ? "FINAL · all " + teamsTotal + " teams reported"
                : "TENTATIVE · " + teamsIn + " of " + teamsTotal + " teams reported";

    /* left: the tournament, one page at a time */
    var group = h("colgroup",{},[
      h("col",{class:"c-rank"}), h("col",{class:"c-team"}),
      h("col",{class:"c-par"}), h("col",{class:"c-net"})
    ]);
    var tt = h("table",{},[group, h("tr",{},[h("th",{text:""}),h("th",{text:"Team"}),h("th",{text:"To par",class:"r"}),h("th",{text:"Net total",class:"r"})])]);

    /* Only the winner is shaded. Kyle, 2026-09-12: "We should only shade the
       winner. But somewhere prominent we need to say Won by USGA rules Match
       of Cards." A tie on the total is settled by the match of cards and the
       money goes to one team, so the green marks that team and the band below
       the header says how it was decided. */
    var best = st.done.length ? st.done[0].total : null;
    var tiedAtTop = st.done.filter(function(x){ return x.total === best; });
    var rows = st.done.map(function(x, i){
      return { kind:"done", i:i, x:x, lead:(i === 0) };
    }).concat(st.waiting.map(function(t){ return { kind:"waiting", t:t }; }));

    var pages = Math.max(1, Math.ceil(rows.length / TROWS));
    if (tpage >= pages) tpage = 0;
    var part = rows.slice(tpage * TROWS, tpage * TROWS + TROWS);
    while (part.length < TROWS && pages > 1) part.push(null);

    part.forEach(function(r){
      if (!r){
        tt.appendChild(h("tr",{class:"blankrow"},[h("td",{}),h("td",{}),h("td",{}),h("td",{})]));
        return;
      }
      if (r.kind === "waiting"){
        tt.appendChild(h("tr",{},[
          h("td",{class:"hn",text:""}),
          h("td",{class:"team muted",text:r.t.players.map(first).join(" & ")}),
          h("td",{colspan:"2"},[h("span",{class:"pill team",text:"Scores not in yet"})])
        ]));
        return;
      }
      tt.appendChild(h("tr",{class:(r.lead ? "lead" : "")},[
        h("td",{class:"hn",text:String(r.i+1)}),
        h("td",{class:"team",text:r.x.team.players.map(first).join(" & ")}),
        h("td",{class:"n topar",text:Sc.toPar(r.x.total)}),
        h("td",{class:"n muted",text:String(r.x.total)})
      ]));
    });

    /* right: the skins, one block per pot */
    var players = ids.map(function(pid){ return by[pid]; });
    var pots = Sc.pots(players, LIVE.cutoff == null ? null : LIVE.cutoff);
    function potBlock(members, useGross, label){
      var t = h("table",{},[h("tr",{},[h("th",{text:"Hole"}),h("th",{text:"Skin"}),h("th",{text:useGross?"Gross score":"Net score",class:"r"})])]);
      var n = 0;
      Sc.skins(members, useGross).forEach(function(r){
        if (r.kind !== "skin") return;
        n++;
        t.appendChild(h("tr",{class:"skin"},[
          h("td",{class:"hn",text:String(r.hole)}),
          h("td",{class:"who",text: player(r.holder) ? player(r.holder).name : "?"}),
          h("td",{class:"n",text:String(r.score)})
        ]));
      });
      if (!n) t.appendChild(h("tr",{},[h("td",{colspan:"3",class:"muted",text:"No skins yet"})]));
      var hd = h("div",{class:"sect secthead"},[h("span",{text:label})]);
      if (status !== "final" && teamsTotal) hd.appendChild(h("span",{class:"pill pend",text:"Not all scores in yet"}));
      return [hd, t];
    }
    var blocks = LIVE.cutoff == null
      ? potBlock(pots.net, false, "Net skins")
      : potBlock(pots.gross, true, "Gross skins · hcp " + LIVE.cutoff + " and under")
          .concat(potBlock(pots.net, false, "Net skins · hcp over " + LIVE.cutoff));

    s.appendChild(head(eyebrow, (LIVE.event && LIVE.event.name) || "Mengacci $$"));
    if (tiedAtTop.length > 1){
      /* Say exactly how it was decided, not just that it was. Kyle,
         2026-09-12: "How about explaining even more how the match of cards was
         ultimately decided in the banner?" scoring.js already records which
         comparison broke it and both numbers; this puts them on the wall so
         nobody has to take it on trust. */
      var mine = st.done[0], other = tiedAtTop[1];
      var m = Sc.matchOfCards(mine.bb, other.bb);
      var WORD = { "back 9":"the back nine", "last 6":"the last six",
                   "last 3":"the last three", "18th":"the 18th" };
      var why;
      if (m.how && WORD[m.how]) {
        why = "level on " + best + " with " + other.team.players.map(first).join(" & ")
            + " · won on " + WORD[m.how] + ", " + m.av + " to " + m.bv
            + " · USGA match of cards";
      } else {
        /* identical through all 18: the rules run out and a person decides */
        why = "level on " + best + " with " + other.team.players.map(first).join(" & ")
            + " · cards identical through 18 · the match of cards cannot separate them";
      }
      s.appendChild(h("div",{class:"cards"},[
        h("span",{class:"lab",text: (m.how && WORD[m.how]) ? "Match of cards" : "Still tied"}),
        h("span",{class:"who",text: mine.team.players.map(first).join(" & ")}),
        h("span",{class:"why",text: why})
      ]));
    }
    var grid = h("div",{class:"grid"},[
      h("div",{class:"col"},[
        h("div",{class:"sect secthead"},[
          h("span",{text:"Tournament · 2-man best ball net"}),
          pages > 1 ? h("span",{class:"pill team",text:(tpage+1) + " of " + pages}) : null
        ]),
        tt]),
      h("div",{class:"col"}, blocks)
    ]);
    s.appendChild(h("div",{class:"scroll"},[grid]));
    fit(grid);
  }

  /* Top right: when the PHONE last sent, not when this page last asked. If our
     own polling has gone quiet for a minute and a half, say so in gold rather
     than let a frozen board look live. */
  /* The date, spelled out. Kyle, 2026-09-12: "We should have the date up there
     somewhere too." It comes from the round the phone posted, so a board left
     running overnight cannot claim to be today's. */
  function eventDate(){
    var raw = LIVE && LIVE.event && LIVE.event.date;
    if (!raw) return "";
    var d = new Date(String(raw) + (String(raw).length === 10 ? "T12:00:00" : ""));
    if (isNaN(d)) return String(raw);
    var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    var mons = ["January","February","March","April","May","June","July",
                "August","September","October","November","December"];
    return days[d.getDay()] + ", " + mons[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  }

  function head(eyebrow, title){
    var age = lastOK ? Date.now() - lastOK : 0;
    var sent = LIVE && (LIVE.received || LIVE.posted) ? clock(Date.parse(LIVE.received || LIVE.posted)) : null;
    var right = !lastOK ? h("div",{class:"right"},[h("span",{class:"warn",text:"connecting"})])
      : age > STALE ? h("div",{class:"right"},[h("span",{class:"warn",text:"not updating · scores as of "+(sent||clock(lastOK))})])
      : h("div",{class:"right",text: sent ? "scores as of "+sent : "updated "+clock(lastOK)});
    return h("div",{class:"top"},[
      h("div",{class:"tophead"},[
        h("img",{class:"logo",src:"ccw-logo.png",alt:"Country Club of Waterbury",
          style:"cursor:pointer",onclick:function(){ location.href = "../"; }}),
        h("div",{},[
          h("div",{class:"eyebrow",text:eyebrow}),
          h("h1",{text:title}),
          h("div",{class:"event",text:eventDate()})
        ])
      ]),
      right
    ]);
  }

  /* ---------- the poll: never blank the board on a failure ---------- */
  function poll(){
    if (!TV_API){ render(); return; }
    var url = TV_API + (TV_API.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now();
    fetch(url, { method:"GET", cache:"no-store" })
      .then(function(r){ return r.json(); })
      .then(function(data){
        everFetched = true;
        if (data && data.format === "mengacci-live-v1"){ LIVE = data; lastOK = Date.now(); }
        render();
      })
      .catch(function(){ render(); });   /* keep the last good board up */
  }

  render();
  poll();
  setInterval(poll, EVERY);
  /* turn the page */
  function armPages(){
    if (ttimer) clearInterval(ttimer);
    ttimer = setInterval(function(){ tpage++; render(); }, TSECS * 1000);
  }
  armPages();
  /* Measure again once the web font has arrived: Barlow Condensed lands after
     the first paint and every row grows when it does, so the first measurement
     is of a page that no longer exists. This, not the obvious suspects, is what
     cut rows off the club TV. The timers cover a browser without document.fonts,
     and resize covers a television that changes mode. */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ render(); });
  setTimeout(render, 600);
  setTimeout(render, 2500);
  window.addEventListener("resize", function(){ render(); });
})();
</script>
</body>
</html>
